<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Isabella the Mermaid</title>
<style>
  :root { --gold1:#fff1a0; --gold2:#ffc21a; --gold3:#d98a00; }
  html, body { margin:0; height:100%; overflow:hidden; background:#1f8fc0; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    font-family: system-ui, Roboto, sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .screen { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; }
  .screen.on { display:flex; }
  .dim { background:rgba(0,30,60,0.45); }
  button { font:inherit; color:inherit; border:none; padding:0; cursor:pointer; }
  .btn { width:24vh; height:24vh; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 28%, var(--gold1), var(--gold2) 55%, var(--gold3));
    box-shadow:0 1.3vh 0 #a86400, 0 2.5vh 4vh rgba(0,0,0,0.3); transition:transform .08s; }
  .btn:active { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #a86400; }
  .btn svg { width:56%; height:56%; fill:#fff; filter:drop-shadow(0 .4vh 0 rgba(150,80,0,0.6)); }
  .btn.sm { width:15vh; height:15vh; }
  .btn.pink { background:radial-gradient(circle at 35% 28%, #ffd1ea, #ff6fb0 55%, #d63384); box-shadow:0 1.3vh 0 #9c1f5c, 0 2.5vh 4vh rgba(0,0,0,0.3); }
  .btn.blue { background:radial-gradient(circle at 35% 28%, #c9f3ff, #4cc9f0 55%, #1b7fb8); box-shadow:0 1.3vh 0 #145f8a, 0 2.5vh 4vh rgba(0,0,0,0.3); }
  .btn.pink svg, .btn.blue svg { filter:drop-shadow(0 .4vh 0 rgba(0,0,0,0.25)); }
  .corner { position:fixed; top:4vh; right:5vw; }
  .corner-l { position:fixed; top:4vh; left:5vw; }
  .row { display:flex; gap:5vh; align-items:center; justify-content:center; }

  /* title */
  #title .box { position:fixed; right:6vw; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:center; gap:4vh; }
  .logo { text-align:center; line-height:0.9; }
  /* Outlines are stacked drop-shadows: -webkit-text-stroke traces every glyph contour and
     left stray lines inside the letters on the Seeker. */
  .ol-brown { filter:drop-shadow(.6vh 0 0 #b0480c) drop-shadow(-.6vh 0 0 #b0480c) drop-shadow(0 .6vh 0 #b0480c) drop-shadow(0 -.6vh 0 #b0480c) drop-shadow(0 1vh 0 rgba(120,30,0,0.35)); }
  .ol-pink { filter:drop-shadow(.45vh 0 0 #c2337a) drop-shadow(-.45vh 0 0 #c2337a) drop-shadow(0 .45vh 0 #c2337a) drop-shadow(0 -.45vh 0 #c2337a); }
  .ol-white { filter:drop-shadow(.35vh 0 0 #fff) drop-shadow(-.35vh 0 0 #fff) drop-shadow(0 .35vh 0 #fff) drop-shadow(0 -.35vh 0 #fff); }
  .ol-navy { filter:drop-shadow(.35vh 0 0 rgba(0,40,80,0.75)) drop-shadow(-.35vh 0 0 rgba(0,40,80,0.75)) drop-shadow(0 .35vh 0 rgba(0,40,80,0.75)) drop-shadow(0 -.35vh 0 rgba(0,40,80,0.75)); }
  .logo .l1 { font-size:19vh; font-weight:900; letter-spacing:.5vh;
    background:linear-gradient(180deg,#fff7b0,#ffd23f 45%,#ff9f1c); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .logo .l2 { font-size:9vh; font-weight:900; color:#fff; margin-top:1vh; }
  .gold { display:flex; align-items:center; gap:1.5vh; font-size:6vh; font-weight:900; color:#fff; }
  .coin { width:6vh; height:6vh; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff6b0, #ffd633 45%, #e8a200); box-shadow:inset 0 0 0 .5vh rgba(180,110,0,0.5); }

  /* level map */
  #grid { display:grid; grid-template-columns:repeat(5, 20vh); gap:4vh 5vh; }
  .lvl { width:20vh; height:20vh; border-radius:50%; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 1.1vh 0 rgba(0,40,80,0.45), inset 0 -1.5vh 3vh rgba(0,0,0,0.2), inset 0 1.5vh 2vh rgba(255,255,255,0.5); border:.6vh solid #fff; }
  .lvl:active { transform:translateY(.8vh); }
  .lvl .num { font-size:9vh; font-weight:900; color:#fff; line-height:1; }
  .lvl .st { display:flex; gap:.3vh; margin-top:.6vh; }
  .lvl .st svg { width:4.2vh; height:4.2vh; }
  .lvl.locked { filter:grayscale(0.8) brightness(0.75); }
  .lvl.locked .num { display:none; }
  .lvl .lock { width:8vh; height:8vh; fill:#fff; display:none; }
  .lvl.locked .lock { display:block; }
  .lvl.locked .st { display:none; }

  /* intro banner */
  .card { background:rgba(255,255,255,0.93); border-radius:6vh; padding:5vh 8vh; display:flex; flex-direction:column; align-items:center; gap:3vh;
    box-shadow:0 2vh 0 rgba(0,40,80,0.3); border:.8vh solid #ffd23f; }
  .lvlno { font-size:7vh; font-weight:900; color:#1b7fb8; }
  .lvlname { font-size:11vh; font-weight:900; color:#ff4d8d; }
  .picto { display:flex; align-items:center; gap:3vh; }
  .picto svg { height:14vh; width:auto; }
  .bigstars { display:flex; gap:3vh; }
  .bigstars svg { width:18vh; height:18vh; transform:scale(0); }
  .bigstars svg.pop { animation:pop .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes pop { to { transform:scale(1); } }
  .result-coins { font-size:9vh; font-weight:900; color:#d98a00; display:flex; align-items:center; gap:2vh; }
  .result-coins .coin { width:9vh; height:9vh; }

  .pg-l { position:fixed; left:5vw; top:50%; transform:translateY(-50%); }
  .pg-r { position:fixed; right:5vw; top:50%; transform:translateY(-50%); }
  .pg-l:active, .pg-r:active { transform:translateY(-50%) scale(0.95); }
  .world { position:fixed; top:5vh; left:0; right:0; text-align:center; font-size:8vh; font-weight:900; color:#fff; pointer-events:none; }
  .dots { position:fixed; bottom:5vh; left:0; right:0; display:flex; gap:2vh; justify-content:center; pointer-events:none; }
  .dots span { width:2.6vh; height:2.6vh; border-radius:50%; background:rgba(255,255,255,0.45); }
  .dots span.on { background:#fff; }
  #resCrown svg { width:22vh; height:auto; filter:drop-shadow(0 1vh 0 rgba(150,80,0,0.35)); }
  .pill { position:fixed; top:7vh; left:calc(5vw + 19vh); display:flex; align-items:center; gap:1.6vh; padding:1.8vh 3.4vh 1.8vh 2.4vh;
    border:none; border-radius:7vh; background:rgba(255,255,255,0.92); color:#1b7fb8; font-size:4.6vh; font-weight:900;
    box-shadow:0 1vh 0 rgba(0,40,80,0.35); }
  .pill:active { transform:translateY(.7vh); box-shadow:0 .3vh 0 rgba(0,40,80,0.35); }
  .pill svg { width:7vh; height:7vh; }
  .hint { position:fixed; left:50%; bottom:6vh; transform:translateX(-50%); max-width:80vw; padding:2vh 4vh; border-radius:4vh;
    background:rgba(255,255,255,0.95); color:#1b4f72; font-size:4.2vh; font-weight:800; text-align:center; display:none; }
  #pauseBtn { position:fixed; top:3vh; right:4vw; width:13vh; height:13vh; border-radius:50%; background:rgba(255,255,255,0.35);
    border:.5vh solid rgba(255,255,255,0.8); display:none; align-items:center; justify-content:center; }
  #pauseBtn svg { width:55%; height:55%; fill:#fff; }
  #pauseBtn.on { display:flex; }

  /* ===== store flavor only (paywall.js): free tier + grown-ups' screens. Targets are >= 19vh. ===== */
  [hidden] { display:none !important; }
  .btn.md { width:19vh; height:19vh; }
  /* World 2 before a grown-up unlocks it: the bubble keeps its colour and wears a gold padlock */
  .lvl.paylock { filter:saturate(0.7) brightness(0.9); }
  .lvl.paylock .num, .lvl.paylock .st { display:none; }
  .lvl .plock { width:10vh; height:12vh; filter:drop-shadow(0 .6vh 0 rgba(0,40,80,0.4)); }
  /* the grown-ups' button on the title: small to look at, a full 19vh to press */
  .pw-parent { position:fixed; left:4vw; bottom:3vh; width:19vh; height:19vh; display:flex; align-items:center; justify-content:center; background:none; }
  .pw-parent span { width:12vh; height:12vh; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.25); border:.45vh solid rgba(255,255,255,0.75); }
  .pw-parent svg { width:66%; height:66%; fill:#fff; }
  .pw-parent:active span { transform:scale(0.94); }

  .ov { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; flex-direction:column; }
  .ov.on { display:flex; }
  .ov.dim { background:rgba(0,30,60,0.55); }
  .ov.grown { background:linear-gradient(160deg, rgba(12,62,108,0.97), rgba(4,30,56,0.98)); color:#fff; }
  #pwYay { z-index:25; }
  #pwConfirm { z-index:30; }

  /* kids: ask a grown-up */
  .ask { gap:2.5vh; padding:4vh 8vh 5vh; }
  .ask-pic { display:flex; align-items:center; gap:2vh; }
  .ask-adult { width:30vh; height:27.5vh; fill:#1b7fb8; }
  .ask-key { width:22vh; height:11vh; }
  .ask-lock { width:20vh; height:24vh; }
  .ask-txt { font-size:6vh; font-weight:900; color:#1b7fb8; }
  .ask .row { gap:7vh; }

  /* grown-ups: shared. Text scales with --u (= 1vh on the Seeker's 20:9, smaller on squarer screens);
     touch targets stay in vh. */
  :root { --u: min(1vh, 0.55vw); }
  .pw-x { width:19vh; height:19vh; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.14); border:.5vh solid rgba(255,255,255,0.6); }
  .pw-x svg { width:40%; height:40%; fill:#fff; }
  .pw-x:active { transform:scale(0.95); }
  .pw-x-abs { position:absolute; top:4vh; left:4vw; }
  .pw-kicker { font-size:calc(var(--u) * 3.8); font-weight:800; letter-spacing:.3vh; text-transform:uppercase; color:#ffd23f; }
  .pw-h1 { font-size:calc(var(--u) * 7); font-weight:900; text-align:center; }
  .pw-h2 { font-size:calc(var(--u) * 6.4); font-weight:900; text-align:center; }
  .pw-h3 { font-size:calc(var(--u) * 4.4); font-weight:900; color:#ffd23f; }
  .pw-title { font-size:calc(var(--u) * 7.4); font-weight:900; line-height:1.05; }
  .pw-title.st.ok { color:#8dffb4; }
  .pw-sub { font-size:calc(var(--u) * 4.2); font-weight:700; color:#bcdcf5; margin-top:.8vh; }
  .pw-warn { font-size:calc(var(--u) * 3.7); font-weight:800; color:#ffd23f; margin-top:1vh; }
  .pw-p { font-size:calc(var(--u) * 4.3); line-height:1.35; color:#d4e8fa; max-width:150vh; margin:0 auto; text-align:center; }
  .pw-small { font-size:calc(var(--u) * 3.2); color:#9fc3df; max-width:150vh; margin:0 auto; text-align:center; word-break:break-word; }
  .pw-note { font-size:calc(var(--u) * 3.8); color:#bcdcf5; font-weight:700; }
  .pw-row { display:flex; gap:4vh; justify-content:center; flex-wrap:wrap; }
  .pw-body { width:100%; height:100%; box-sizing:border-box; padding:4vh 4vw; overflow-y:auto; touch-action:pan-y;
    display:flex; flex-direction:column; gap:3.5vh; }
  .pw-head { display:flex; align-items:center; justify-content:space-between; gap:3vw; }
  .pw-center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vh; }
  .spin { width:15vh; height:15vh; border-radius:50%; box-sizing:border-box; border:1.6vh solid rgba(255,255,255,0.18); border-top-color:#ffd23f; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .pbtn { min-height:19vh; min-width:46vh; padding:1.5vh 5vh; box-sizing:border-box; border-radius:4vh; font-size:calc(var(--u) * 4.6); font-weight:900; line-height:1.15;
    background:rgba(255,255,255,0.12); border:.5vh solid rgba(255,255,255,0.65); color:#fff; }
  .pbtn.primary { background:radial-gradient(circle at 35% 25%, var(--gold1), var(--gold2) 60%, var(--gold3)); border:none; color:#4a2a00; box-shadow:0 1vh 0 #a86400; }
  .pbtn:active { transform:translateY(.6vh); }

  /* the gate */
  .gate-hold { display:flex; flex-direction:column; align-items:center; gap:3vh; }
  .hold { position:relative; width:34vh; height:34vh; margin-top:3vh; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 28%, var(--gold1), var(--gold2) 55%, var(--gold3)); box-shadow:0 1.3vh 0 #a86400;
    touch-action:none; -webkit-touch-callout:none; }
  .hold.holding { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #a86400; }
  .hold .hand { width:46%; height:46%; fill:#fff; filter:drop-shadow(0 .4vh 0 rgba(150,80,0,0.6)); }
  .hold .ring { position:absolute; left:-4vh; top:-4vh; width:calc(100% + 8vh); height:calc(100% + 8vh); transform:rotate(-90deg); pointer-events:none; }
  .ring-bg { fill:none; stroke:rgba(255,255,255,0.18); stroke-width:5; }
  .ring-fg { fill:none; stroke:#ffd23f; stroke-width:5; stroke-linecap:round; stroke-dasharray:289.03; stroke-dashoffset:289.03; opacity:0; }
  .hold.holding .ring-fg { opacity:1; }
  .gate-math { display:flex; align-items:center; gap:6vh; }
  .gm-left { display:flex; flex-direction:column; align-items:center; gap:3vh; }
  .gm-q { font-size:min(12vh, 5.4vw); font-weight:900; white-space:nowrap; }
  .gm-a { display:inline-block; min-width:2.3em; padding:0 .15em; border-bottom:.8vh solid #ffd23f; text-align:center; color:#ffd23f; }
  .pad { display:grid; grid-template-columns:repeat(3, max(19vh, min(24vh, 13vw))); grid-auto-rows:19.5vh; gap:1.6vh; }
  .pad button { border-radius:3vh; background:#fff; color:#0b3a66; font-size:9vh; font-weight:900; box-shadow:0 .9vh 0 rgba(0,0,0,0.35); }
  .pad button:active { transform:translateY(.6vh); box-shadow:0 .3vh 0 rgba(0,0,0,0.35); }
  .pad .ok { background:radial-gradient(circle at 35% 25%, var(--gold1), var(--gold2) 60%, var(--gold3)); color:#4a2a00; font-size:7vh; }
  .pad .del svg { width:9vh; height:9vh; fill:#0b3a66; }
  .shake { animation:shake .45s; }
  @keyframes shake { 15%, 85% { transform:translateX(-1vh); } 30%, 70% { transform:translateX(2.5vh); } 45% { transform:translateX(-3vh); } 60% { transform:translateX(3vh); } }

  /* the paywall */
  .pw-opts { display:grid; grid-template-columns:1fr 1fr; gap:3vw; align-items:start; }
  .pw-col { display:flex; flex-direction:column; gap:2.5vh; }
  .opt { min-height:22vh; border-radius:4vh; display:flex; align-items:center; gap:calc(var(--u) * 3); padding:2.5vh calc(var(--u) * 3.5); text-align:left;
    background:#fff; color:#0b3a66; box-shadow:0 1.1vh 0 rgba(0,0,0,0.35); }
  .opt.primary { background:radial-gradient(circle at 30% 20%, #fff7c2, #ffd23f 60%, #f5a700); color:#4a2a00; box-shadow:0 1.1vh 0 #a86400; }
  .opt:active { transform:translateY(.7vh); }
  .opt .ic { flex:none; width:calc(var(--u) * 14); height:calc(var(--u) * 14); }
  .opt b { display:block; font-size:calc(var(--u) * 6.4); font-weight:900; line-height:1.05; white-space:nowrap; }
  .opt span { display:block; font-size:calc(var(--u) * 4.2); font-weight:700; opacity:0.85; margin-top:1vh; }
  .pw-notes { margin:0; padding:0 0 0 calc(var(--u) * 3.4); font-size:calc(var(--u) * 3.5); line-height:1.3; color:#d4e8fa; }
  .pw-notes li { margin:.5vh 0; }
  .toks { display:flex; gap:4vh; flex-wrap:wrap; justify-content:center; }
  .tok { min-height:24vh; min-width:60vh; border-radius:4vh; display:flex; align-items:center; gap:3vh; padding:0 6vh; background:#fff; color:#0b3a66;
    box-shadow:0 1.1vh 0 rgba(0,0,0,0.35); font-size:calc(var(--u) * 6.4); }
  .tok:active { transform:translateY(.7vh); }
  .tok img, .tok .tl { width:12vh; height:12vh; border-radius:50%; flex:none; }
  .tok .tl { display:flex; align-items:center; justify-content:center; background:#ffd23f; color:#4a2a00; font-weight:900; font-size:6vh; }

  /* the grown-ups' screen */
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:3vh 3vw; }
  .acts .pbtn { min-width:0; width:100%; }
  .pend { display:flex; flex-direction:column; gap:2vh; }
  .pend-row { display:flex; align-items:center; justify-content:space-between; gap:3vw; min-height:19vh; padding:0 0 0 4vh; border-radius:4vh; background:rgba(255,255,255,0.09); }
  .pend-row b { display:block; font-size:calc(var(--u) * 5); }
  .pend-row span { display:block; font-size:calc(var(--u) * 3.8); color:#bcdcf5; font-weight:700; }
  .pend-row .pbtn { min-width:36vh; }

  /* confirm */
  .pw-dialog { width:min(150vh, 88vw); box-sizing:border-box; padding:5vh 5vh 4.5vh; border-radius:5vh; background:#fff; color:#0b3a66;
    box-shadow:0 2vh 0 rgba(0,40,80,0.35); display:flex; flex-direction:column; gap:3vh; border:.8vh solid #ffd23f; }
  .pw-dialog .pw-p { color:#24506f; max-width:none; }
  .pw-dialog .pbtn { color:#0b3a66; background:#eef5fb; border-color:#9fc3df; }
  .pw-dialog .pbtn.primary { color:#4a2a00; background:radial-gradient(circle at 35% 25%, var(--gold1), var(--gold2) 60%, var(--gold3)); }

  /* World 2 unlocked */
  #pwYay { background:rgba(0,30,60,0.2); }
  .yay { gap:1vh; padding:4vh 10vh; }
  .yay-lock { width:20vh; height:26vh; animation:pwpop .6s cubic-bezier(.3,1.8,.5,1) both; }
  .yay-txt { font-size:12vh; font-weight:900; color:#ff4d8d; }
  @keyframes pwpop { from { transform:scale(0) rotate(-20deg); } to { transform:scale(1) rotate(0); } }
  .confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .confetti i { position:absolute; top:-6vh; width:2.4vh; height:1.4vh; border-radius:.3vh; animation-name:fall; animation-timing-function:linear; animation-fill-mode:forwards; }
  .confetti i.c { width:5vh; height:5vh; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff6b0, #ffd633 45%, #e8a200); box-shadow:inset 0 0 0 .5vh rgba(180,110,0,0.5); }
  @keyframes fall { to { transform:translate3d(var(--dx), 115vh, 0) rotate(var(--rot)); } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 2.5 1.5 12H5v9h5.5v-6h3v6H19v-9h3.5z"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M12 4V0L6 6l6 6V8a6 6 0 1 1-6 6H3a9 9 0 1 0 9-10z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M3 4v16l9-8zM12 4v16l9-8z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3.6"/><circle cx="18" cy="6" r="3.6"/><circle cx="6" cy="18" r="3.6"/><circle cx="18" cy="18" r="3.6"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM16 7.5a6 6 0 0 1 0 9l-1.4-1.4a4 4 0 0 0 0-6.2zM18.8 4.7a10 10 0 0 1 0 14.6l-1.4-1.4a8 8 0 0 0 0-11.8z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM15 8.4l1.4-1.4 2.6 2.6 2.6-2.6L23 8.4l-2.6 2.6 2.6 2.6-1.4 1.4-2.6-2.6-2.6 2.6-1.4-1.4 2.6-2.6z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M12 1.5a5.5 5.5 0 0 0-5.5 5.5v3H4.5v12.5h15V10h-2V7A5.5 5.5 0 0 0 12 1.5zM9 10V7a3 3 0 0 1 6 0v3z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1L1.7 9.2l7.2-.8z"/></symbol>

<div id="title" class="screen on">
  <div class="box">
    <div class="logo" id="logo"><div class="ol-brown"><div class="l1">Isabella</div></div><div class="l2 ol-pink">the Mermaid</div></div>
    <button id="playBtn" class="btn"><svg><use href="#i-play"/></svg></button>
    <div class="gold"><span class="coin"></span><span id="goldTotal" class="ol-navy">0</span></div>
  </div>
  <button id="soundBtn" class="btn sm blue corner-l"><svg><use href="#i-sound"/></svg></button>
  <button id="pinBtn" class="pill" style="display:none"><svg viewBox="0 0 24 24"><use href="#i-addhome"/></svg><span>Add to Home screen</span></button>
  <div id="pinHint" class="hint">Tap <b>Add to home screen</b> on the next screen.</div>
  <button id="parentBtn" class="pw-parent" aria-label="Grown-ups" hidden><span><svg><use href="#i-grownup"/></svg></span></button>
</div>

<div id="levels" class="screen">
  <button id="levelsHome" class="btn sm blue corner-l"><svg><use href="#i-home"/></svg></button>
  <div class="world ol-navy" id="worldName">World 1</div>
  <button id="pgPrev" class="btn sm pink pg-l"><svg style="transform:scaleX(-1)"><use href="#i-play"/></svg></button>
  <div id="grid"></div>
  <button id="pgNext" class="btn sm pink pg-r"><svg><use href="#i-play"/></svg></button>
  <div class="dots" id="pgDots"></div>
</div>

<div id="intro" class="screen">
  <div class="card">
    <div class="lvlno" id="introNo">Level 1</div>
    <div class="lvlname ol-white" id="introName">Sunny Shallows</div>
    <div class="picto"><svg viewBox="0 0 64 32"><use href="#i-key"/></svg><svg viewBox="0 0 32 24" style="height:8vh"><use href="#i-arrow"/></svg><svg viewBox="0 0 64 52"><use href="#i-chest"/></svg></div>
  </div>
</div>

<button id="pauseBtn"><svg><use href="#i-pause"/></svg></button>

<div id="pause" class="screen dim">
  <div class="row">
    <button id="pauseHome" class="btn sm blue"><svg><use href="#i-home"/></svg></button>
    <button id="pauseResume" class="btn"><svg><use href="#i-play"/></svg></button>
    <button id="pauseRestart" class="btn sm pink"><svg><use href="#i-replay"/></svg></button>
  </div>
</div>

<div id="results" class="screen dim">
  <div class="card">
    <div id="resCrown" style="display:none"><svg viewBox="0 0 64 44"><use href="#i-crown"/></svg></div>
    <div class="bigstars" id="bigStars"></div>
    <div class="result-coins"><span class="coin"></span><span id="resCoins">0</span></div>
    <div class="row">
      <button id="resLevels" class="btn sm blue"><svg><use href="#i-grid"/></svg></button>
      <button id="resReplay" class="btn sm pink"><svg><use href="#i-replay"/></svg></button>
      <button id="resNext" class="btn"><svg><use href="#i-next"/></svg></button>
    </div>
  </div>
</div>

<!-- ===== Store flavor only (paywall.js): the free tier and the grown-ups' screens ===== -->
<!-- Kids: World 2 is locked, ask a grown-up. Pictures only: a grown-up holds the key to the padlock. -->
<div id="pwAsk" class="ov dim" role="dialog" aria-label="Ask a grown-up">
  <div class="card ask">
    <div class="ask-pic">
      <svg class="ask-adult" style="--kid:#ff6fb0"><use href="#i-grownup"/></svg>
      <svg class="ask-key" viewBox="0 0 64 32"><use href="#i-key"/></svg>
      <svg class="ask-lock" viewBox="0 0 40 48"><use href="#i-padgold"/></svg>
    </div>
    <div class="ask-txt">Ask a grown-up</div>
    <div class="row">
      <button id="pwAskBack" class="btn md blue" aria-label="Back"><svg style="transform:scaleX(-1)"><use href="#i-play"/></svg></button>
      <button id="pwAskGo" class="btn" aria-label="Grown-ups"><svg><use href="#i-grownup"/></svg></button>
    </div>
  </div>
</div>

<!-- Grown-ups: hold for 3 seconds, then a multiplication. -->
<div id="pwGate" class="ov grown" role="dialog" aria-label="For grown-ups">
  <button id="pwGateX" class="pw-x pw-x-abs" aria-label="Cancel"><svg><use href="#i-close"/></svg></button>
  <div id="pwHoldStage" class="gate-hold">
    <div class="pw-kicker">For grown-ups</div>
    <div class="pw-h1">Press and hold for 3 seconds</div>
    <button id="pwHoldBtn" class="hold" aria-label="Press and hold for 3 seconds">
      <svg class="ring" viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="46"/><circle id="pwRing" class="ring-fg" cx="50" cy="50" r="46"/></svg>
      <svg class="hand"><use href="#i-hand"/></svg>
    </button>
  </div>
  <div id="pwMathStage" class="gate-math" hidden>
    <div class="gm-left">
      <div class="pw-kicker">For grown-ups</div>
      <div class="gm-q"><span id="pwMathQ"></span> = <span id="pwMathA" class="gm-a"></span></div>
      <div class="pw-note">Type the answer, then tap OK.</div>
    </div>
    <div class="pad" id="pwPad"></div>
  </div>
</div>

<div id="pwPay" class="ov grown" role="dialog" aria-label="Unlock World 2"><div class="pw-body" id="pwPayBody"></div></div>
<div id="pwManage" class="ov grown" role="dialog" aria-label="Grown-ups"><div class="pw-body" id="pwManBody"></div></div>

<div id="pwConfirm" class="ov dim" role="alertdialog" aria-labelledby="pwCfT">
  <div class="pw-dialog">
    <div class="pw-h2" id="pwCfT"></div>
    <p class="pw-p" id="pwCfB"></p>
    <div class="pw-row"><button id="pwCfNo" class="pbtn"></button><button id="pwCfYes" class="pbtn primary"></button></div>
  </div>
</div>

<!-- World 2 unlocked: an open padlock, coins and confetti, then the World 2 levels. -->
<div id="pwYay" class="ov" role="dialog" aria-label="World 2 is open">
  <div class="confetti" id="pwConfetti"></div>
  <div class="card yay">
    <svg class="yay-lock" viewBox="0 0 40 52"><use href="#i-padopen"/></svg>
    <div class="yay-txt ol-white">World 2!</div>
    <button id="pwYayGo" class="btn" aria-label="Play"><svg><use href="#i-play"/></svg></button>
  </div>
</div>

<!-- Order fixed by docs/kids-bundle/BUILD-PLAN.md. config.js, vendor/solana.js, wallet.js, entitlement.js
     and payments.js belong to the payments work; the game runs without them (paywall.js shows
     "Unlock unavailable"), and ?mockpay=1 swaps in paymock.js instead. -->
<script src="flavor.js"></script>
<script src="config.js"></script>
<script src="vendor/solana.js"></script>
<script src="wallet.js"></script>
<script src="entitlement.js"></script>
<script src="payments.js"></script>
<script src="core.js"></script>
<script src="render.js"></script>
<script src="audio.js"></script>
<script src="paywall.js"></script>
<script src="app.js"></script>
</body>
</html>
