<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fairy art sheet</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="fairy.js"></script>
<script>
(function () {
  'use strict';
  const F = window.FairyArt, cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const q = new URLSearchParams(location.search), T0 = q.has('t') ? +q.get('t') : 0.7;
  function label(text, x, y, color) {
    ctx.save(); ctx.font = '600 12px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = color || '#3a4a66'; ctx.fillText(text, x, y); ctx.restore();
  }
  const POSES = ['fly', 'hover', 'stand', 'sit', 'slide', 'fall'];
  const grounded = (p) => p === 'stand' || p === 'sit' || p === 'slide';

  // just Isabella the Fairy: every pose large (happy off, then happy on and flipped), then the small size
  function drawPoses(time) {
    cv.width = 1920; cv.height = 800;
    F.drawSky(ctx, 1920, 800, 3, time);
    ctx.fillStyle = F.THEMES[3].ground[1]; ctx.fillRect(0, 740, 1920, 60);
    ctx.fillStyle = F.THEMES[3].ground[0]; ctx.fillRect(0, 740, 1920, 12);
    const sc = 2.5;
    POSES.forEach((p, i) => {
      const x = 170 + i * 315;
      F.drawFairy(ctx, x, grounded(p) ? 300 : 190, time, { pose: p, scale: sc, dust: p === 'fly' || p === 'hover' ? 1 : 0, glow: p === 'hover' ? 0.5 : 0 });
      F.drawFairy(ctx, x, grounded(p) ? 580 : 470, time, { pose: p, scale: sc, happy: true, flip: true, dust: p === 'stand' ? 0.8 : 0 });
      label(p, x, 24, '#1d3b66');
    });
    POSES.forEach((p, i) => F.drawFairy(ctx, 330 + i * 70, grounded(p) ? 770 : 752, time, { pose: p, scale: 0.7, happy: true }));
    label('scale 0.7 (the size games use)', 120, 790, '#14304f');
  }

  // everything, on one 1920x1080 sheet
  function drawSheet(time) {
    cv.width = 1920; cv.height = 1080;
    ctx.fillStyle = '#eef7ff'; ctx.fillRect(0, 0, 1920, 1080);
    // 1. poses
    F.drawSky(ctx, 1920, 270, 3, time);
    ctx.fillStyle = F.THEMES[3].ground[1]; ctx.fillRect(0, 228, 1920, 42);
    ctx.fillStyle = F.THEMES[3].ground[0]; ctx.fillRect(0, 228, 1920, 8);
    for (let k = 0; k < 2; k++) POSES.forEach((p, i) => {
      const x = 90 + k * 960 + i * 150;
      F.drawFairy(ctx, x, grounded(p) ? 232 : 105, time, { pose: p, scale: 1.5, happy: !!k, flip: !!k, dust: !k && !grounded(p) ? 1 : 0, glow: p === 'hover' ? 0.6 : 0 });
      label(p + (k ? ' (happy, flipped)' : ''), x, 258, '#fff');
    });
    // 2. skies
    F.THEMES.forEach((t, i) => {
      ctx.save(); ctx.translate(10 + i * 238, 282); ctx.beginPath(); ctx.rect(0, 0, 228, 132); ctx.clip();
      F.drawSky(ctx, 228, 132, i, time);
      ctx.fillStyle = t.ground[1]; ctx.fillRect(0, 118, 228, 14); ctx.fillStyle = t.ground[0]; ctx.fillRect(0, 118, 228, 5);
      F.drawCloud(ctx, 14, 72, 84, { light: t.cloud[0], shade: t.cloud[1] });
      t.flower.forEach((c, k) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(134 + k * 22, 112, 7, 0, 6.3); ctx.fill(); });
      ctx.restore();
      label(i + ' ' + t.name, 124 + i * 238, 428);
    });
    // 3. everything else, on a soft sky
    ctx.save(); ctx.translate(0, 440); ctx.beginPath(); ctx.rect(0, 0, 1920, 640); ctx.clip();
    F.drawSky(ctx, 1920, 640, 3, time);
    const row1 = 130, row2 = 285, row3 = 445, row4 = 590;
    F.drawCloud(ctx, 20, row1 - 20, 130, { shade: '#cfe6ff' }); label('cloud', 85, row1 + 6);
    F.drawCloud(ctx, 175, row1 - 20, 130, { shade: '#c9d6ee', grumpy: true }); label('cloud grumpy', 240, row1 + 6);
    F.drawRainbow(ctx, 410, row1 + 4, 70, 9, {}); label('rainbow arc', 410, row1 + 20);
    const S = []; for (let i = 0; i <= 24; i++) { const u = i / 24; S.push({ x: 520 + u * 200, y: row1 - 20 + Math.sin(u * 6.28) * 28 + u * 14 }); }
    F.drawRainbowRibbon(ctx, S, 26, 1); label('rainbow ribbon', 620, row1 + 20);
    F.drawWaterfall(ctx, 790, row1 - 100, 60, 120, time); label('waterfall', 790, row1 + 38);
    for (let k = 0; k < 4; k++) { F.drawTree(ctx, 920 + k * 140, row1 + 6, 0.85, k, time); label('tree ' + k, 920 + k * 140, row1 + 24); }
    ctx.fillStyle = F.THEMES[0].ground[0]; ctx.fillRect(0, row2 + 4, 1920, 22);
    F.drawMushroom(ctx, 50, row2, 1, '#ff4d6d'); F.drawMushroom(ctx, 120, row2, 0.7, '#6c63ff'); label('mushroom', 85, row2 + 20);
    const names = ['daisy', 'tulip', 'bluebell', 'sunflower', 'rose', 'lily'];
    for (let k = 0; k < 6; k++) {
      for (let b = 0; b < 3; b++) F.drawFlower(ctx, 200 + k * 160 + b * 46, row2, 1, k, b / 2, time);
      label(names[k] + ' bloom 0 / .5 / 1', 245 + k * 160, row2 + 20);
    }
    F.drawGrass(ctx, 1180, row2, 120, time); label('grass', 1240, row2 + 20);
    ctx.fillStyle = '#3aa6e0'; ctx.fillRect(1330, row2 - 24, 250, 44);
    F.drawLilyPad(ctx, 1380, row2 - 4, 30, { time }); F.drawLilyPad(ctx, 1480, row2 - 4, 30, { time, flower: true }); label('lily pads', 1450, row2 + 36);
    ctx.fillStyle = '#2a2f6a'; ctx.fillRect(1600, row2 - 70, 300, 76);
    F.drawSparkles(ctx, 1650, row2 - 30, time, 14, 34, 1); label('sparkles', 1650, row2 + 20);
    const D = []; for (let i = 0; i < 10; i++) D.push({ x: 1740 + i * 14, y: row2 - 36 + Math.sin(i * 0.8) * 8, age: i * 0.12 });
    F.drawDust(ctx, D, time); label('dust', 1810, row2 + 20);
    F.drawCoin(ctx, 50, row3 - 20, time * 3, 18); label('coin', 50, row3 + 10);
    F.drawKey(ctx, 140, row3 - 18, 1.2, time); label('key', 140, row3 + 10);
    ctx.save(); ctx.beginPath(); ctx.rect(200, row3 - 120, 300, 150); ctx.clip(); ctx.fillStyle = '#4a3a6a'; ctx.fillRect(200, row3 - 120, 300, 150);
    F.drawChest(ctx, 280, row3, 0, time); label('chest closed', 280, row3 + 30, '#fff');
    F.drawChest(ctx, 430, row3, 1, time); label('chest open', 430, row3 + 30, '#fff'); ctx.restore();
    F.drawButterfly(ctx, 540, row3 - 28, time, '#ff8fc0', 1.3); F.drawButterfly(ctx, 600, row3 - 40, time + 1, '#6c63ff', 1); label('butterfly', 570, row3 + 10);
    for (let k = 0; k < 3; k++) { F.drawBug(ctx, 700 + k * 100, row3 - 30, time, k, 1.2); label('bug ' + k, 700 + k * 100, row3 + 10); }
    ctx.fillStyle = '#1d2a55'; ctx.fillRect(1010, row3 - 60, 150, 80); F.drawFirefly(ctx, 1050, row3 - 30, time, 1); F.drawFirefly(ctx, 1110, row3 - 10, time + 2, 0.8);
    label('firefly (on night)', 1085, row3 + 34);
    F.drawHand(ctx, 1230, row3 - 50, time, 1); label('hand', 1240, row3 + 40);
    ctx.save(); ctx.translate(1390, row3 - 10); ctx.scale(-1, 1); F.drawWings(ctx, time, { freq: 8, amp: 0.5, scale: 1.2 }); ctx.restore(); label('wings', 1360, row3 + 18);
    ctx.fillStyle = F.THEMES[0].ground[0]; ctx.fillRect(0, row4 - 4, 1920, 60); ctx.fillStyle = F.THEMES[0].ground[1]; ctx.fillRect(0, row4 + 34, 1920, 30);
    for (let k = 0; k < 3; k++) { F.drawCritter(ctx, 100 + k * 150, row4 + 6, time, k, 1.3); label('critter ' + k, 100 + k * 150, row4 + 50, '#fff'); }
    F.drawFairy(ctx, 600, row4 + 6, time, { pose: 'stand', scale: 1, happy: true }); label('stand (1.0)', 600, row4 + 50, '#fff');
    ctx.restore();
  }
  window.drawSheet = drawSheet; window.drawPoses = drawPoses;
  window.__sheetReady = true;
  drawSheet(T0);
  if (q.has('live')) { const loop = (ms) => { drawSheet(ms / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
