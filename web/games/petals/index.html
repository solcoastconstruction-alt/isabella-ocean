<!doctype html>
<!-- Petal Patterns: a pattern-and-sequence game for ages 3-8 (no words to read, no timers, nothing to lose).
     A row of flowers in pots follows a pattern; the last pot is empty, with a glowing "?" over it. Tap the flower
     that comes next (Isabella the Fairy carries it over, and the whole row blooms). On the hardest levels one pot
     breaks the pattern and the child taps that one. Three sparkles on a wand pick Easy, Medium or Hard; 20 levels
     on two pages (the Meadow, the Cloud Tops) per mode; a treasure chest at the end of every level.
     Standalone page; the hub links here and the home button / Android back button return to ../../index.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Petal Patterns</title>
<link rel="icon" href="data:,">
<style>
  /* Buttons, the level select and the results card follow the other games (Sea Jigsaw, Sea Catch). No blurred shadows or filters. */
  :root { --gold1:#fff1a0; --gold2:#ffc21a; --gold3:#d98a00; --b:20vh; }
  html, body { margin:0; height:100%; overflow:hidden; background:#f7a9d0; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family: system-ui, Roboto, sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .screen { position:fixed; inset:0; display:none; }
  .screen.on { display:block; }
  button { font:inherit; color:inherit; border:none; padding:0; cursor:pointer; background:none; touch-action:manipulation; }
  .btn { width:24vh; height:24vh; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 28%, var(--gold1), var(--gold2) 55%, var(--gold3));
    box-shadow:0 1.3vh 0 #a86400; transition:transform .08s; }
  .btn:active { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #a86400; }
  .btn svg { width:56%; height:56%; fill:#fff; }
  .btn.md { width:19vh; height:19vh; }
  .btn.sm { width:15vh; height:15vh; }
  .btn.pink { background:radial-gradient(circle at 35% 28%, #ffd1ea, #ff6fb0 55%, #d63384); box-shadow:0 1.3vh 0 #9c1f5c; }
  .btn.blue { background:radial-gradient(circle at 35% 28%, #c9f3ff, #4cc9f0 55%, #1b7fb8); box-shadow:0 1.3vh 0 #145f8a; }
  .btn.violet { background:radial-gradient(circle at 35% 28%, #f4e3ff, #b46cf0 55%, #7a2fc0); box-shadow:0 1.3vh 0 #55208a; }
  .row { display:flex; gap:4vh; align-items:center; justify-content:center; }
  /* outlines by offset (no blur, no filter) */
  .ol { text-shadow: .5vh 0 0 #b0480c, -.5vh 0 0 #b0480c, 0 .5vh 0 #b0480c, 0 -.5vh 0 #b0480c, .4vh .4vh 0 #b0480c, -.4vh .4vh 0 #b0480c, .4vh -.4vh 0 #b0480c, -.4vh -.4vh 0 #b0480c, 0 .9vh 0 rgba(120,30,0,0.35); }
  .ol-navy { text-shadow: .3vh 0 0 rgba(120,30,90,0.85), -.3vh 0 0 rgba(120,30,90,0.85), 0 .3vh 0 rgba(120,30,90,0.85), 0 -.3vh 0 rgba(120,30,90,0.85); }

  /* home: a 15vh disc inside a 19vh touch area, top left, on every screen */
  #home { position:fixed; top:1.5vh; left:max(1.2vh, env(safe-area-inset-left)); width:19vh; height:19vh; display:flex; align-items:center; justify-content:center; z-index:10; }
  #home .btn { pointer-events:none; }
  #home:active .btn { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #145f8a; }

  /* level select: the name and the three wands along the top, ten bubbles, the page arrows and dots below */
  .top { position:fixed; top:.5vh; left:calc(max(1.2vh, env(safe-area-inset-left)) + 20vh); right:max(2vw, env(safe-area-inset-right)); height:21vh; display:flex; align-items:center; gap:min(2vh, 1.4vw); }
  .top .t1 { flex:1 1 auto; min-width:0; text-align:center; font-size:min(10vh, 4.6vw); font-weight:900; line-height:1; letter-spacing:.3vh; color:#fff; pointer-events:auto; }
  .modes { display:flex; flex:none; gap:min(1vh, .8vw); }
  .mode { width:19vh; height:19vh; flex:none; display:flex; align-items:center; justify-content:center; }
  .mode .disc { width:15.5vh; height:15.5vh; border-radius:50%; display:flex; align-items:center; justify-content:center; box-sizing:border-box;
    border:.6vh solid rgba(255,255,255,0.55); box-shadow:0 1vh 0 rgba(120,30,90,0.35); transition:transform .15s; opacity:.72; }
  .mode .disc svg { width:72%; height:72%; }
  #mode-easy .disc { background:radial-gradient(circle at 35% 28%, #dafff5, #2ec4a6 55%, #138a74); }
  #mode-medium .disc { background:radial-gradient(circle at 35% 28%, #c9f3ff, #4cc9f0 55%, #1b7fb8); }
  #mode-hard .disc { background:radial-gradient(circle at 35% 28%, #f4e3ff, #b46cf0 55%, #7a2fc0); }
  .mode.on .disc { opacity:1; transform:scale(1.12); border-color:#fff; box-shadow:0 0 0 .8vh rgba(255,210,63,0.95), 0 1.3vh 0 rgba(120,30,90,0.45); }
  .mode:not(.on) .disc { filter:none; }
  .mode:active .disc { transform:scale(1.04) translateY(.8vh); }
  .pill { position:fixed; bottom:3.5vh; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:1.2vh; padding:1.2vh 3vh 1.2vh 2vh;
    border-radius:7vh; background:rgba(255,255,255,0.92); color:#c77700; font-size:5vh; font-weight:900; line-height:1; box-shadow:0 1vh 0 rgba(120,30,90,0.35); pointer-events:none; }
  .pill svg { width:6vh; height:6vh; }

  #grid { position:absolute; left:50%; top:24vh; transform:translateX(-50%); display:grid; grid-template-columns:repeat(5, var(--b)); gap:3vh min(4vh, 2.4vw); }
  .lvl { width:var(--b); height:var(--b); border-radius:50%; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; box-sizing:border-box;
    box-shadow:0 1.1vh 0 rgba(120,30,90,0.45); border:.6vh solid #fff; }
  .lvl:active { transform:translateY(.8vh); }
  .lvl .num { font-size:8.4vh; font-weight:900; color:#fff; line-height:1; }
  .lvl .st { display:flex; gap:.2vh; margin-top:.5vh; }
  .lvl .st svg { width:4.2vh; height:4.2vh; }
  .lvl.locked .num, .lvl.locked .st { display:none; }
  .lvl .lock { width:8vh; height:8vh; fill:#fff; display:none; }
  .lvl.locked .lock { display:block; }
  .lvl.shake { animation:shake .4s; }
  .lvl.next { animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-1.4vh) scale(1.04); } }
  @keyframes shake { 20%,60% { transform:translateX(-1.5vh); } 40%,80% { transform:translateX(1.5vh); } }
  .pg { position:fixed; bottom:.5vh; width:19vh; height:19vh; display:flex; align-items:center; justify-content:center; }
  .pg .btn { pointer-events:none; }
  .pg:active .btn { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #9c1f5c; }
  #pgPrev { left:max(14vw, 24vh); } #pgNext { right:max(14vw, 24vh); }
  .dots { position:fixed; bottom:14vh; left:0; right:0; display:flex; gap:2vh; justify-content:center; pointer-events:none; }
  .dots span { width:2.6vh; height:2.6vh; border-radius:50%; background:rgba(255,255,255,0.5); }
  .dots span.on { background:#fff; box-shadow:0 0 0 .4vh rgba(255,210,63,0.95); }
  .pill { bottom:2.5vh; }

  /* results: a card off to the right, so the open chest and Isabella stay in view on the left */
  #results { background:rgba(120,30,90,0.10); }
  .card { position:fixed; left:68%; top:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,0.94); border-radius:6vh; padding:5vh 5vh 6vh;
    display:flex; flex-direction:column; align-items:center; gap:5vh; box-shadow:0 2vh 0 rgba(120,30,90,0.3); border:.8vh solid #ffd23f; }
  .bigstars { display:flex; gap:3vh; }
  .bigstars svg { width:17vh; height:17vh; transform:scale(0); }
  .bigstars svg.pop { animation:pop .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes pop { to { transform:scale(1); } }
  #resNext { animation:nudge 1.8s ease-in-out 1.6s infinite; }
  @keyframes nudge { 0%, 70%, 100% { transform:scale(1); } 80% { transform:scale(1.08); } 90% { transform:scale(0.98); } }

  /* held upright? (the Android app is always landscape) */
  #rotate { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#f7a9d0; z-index:20; }
  #rotate svg { width:40vw; height:40vw; fill:#fff; animation:turn 2s ease-in-out infinite; }
  @keyframes turn { 0%,25% { transform:rotate(0); } 60%,100% { transform:rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 2.5 1.5 12H5v9h5.5v-6h3v6H19v-9h3.5z"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M12 4V0L6 6l6 6V8a6 6 0 1 1-6 6H3a9 9 0 1 0 9-10z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M3 4v16l9-8zM12 4v16l9-8z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3.6"/><circle cx="18" cy="6" r="3.6"/><circle cx="6" cy="18" r="3.6"/><circle cx="18" cy="18" r="3.6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1L1.7 9.2l7.2-.8z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M12 1.5a5.5 5.5 0 0 0-5.5 5.5v3H4.5v12.5h15V10h-2V7A5.5 5.5 0 0 0 12 1.5zM9 10V7a3 3 0 0 1 6 0v3z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 1h10a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2zm0 3v15h10V4z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3v18l15-9z"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12.8" r="10.5" fill="#c98a00"/><circle cx="12" cy="11.8" r="10.5" fill="#ffd633"/><circle cx="8.6" cy="8" r="3.4" fill="#fff6b0" opacity=".7"/><circle cx="12" cy="11.8" r="7" fill="none" stroke="#b46e00" stroke-width="1.2" opacity=".75"/><path d="M12 7.3l1.4 2.9 3.2.4-2.4 2.2.7 3.2-2.9-1.6-2.9 1.6.7-3.2-2.4-2.2 3.2-.4z" fill="#c87d00" opacity=".85"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></symbol>
  </defs>
</svg>

<div id="levels" class="screen on">
  <div class="top">
    <span class="t1 ol-navy" id="title">Petal Patterns</span>
    <!-- Easy: one sparkle on the wand. Medium: two. Hard: three. -->
    <div class="modes">
      <button id="mode-easy" class="mode" data-mode="easy" aria-label="Easy: one sparkle"><span class="disc"><svg viewBox="0 0 100 100"><path d="M18 88 L58 48" stroke="#fff" stroke-width="7" stroke-linecap="round"/><g fill="#ffd23f"><use href="#i-spark" x="48" y="10" width="38" height="38"/></g></svg></span></button>
      <button id="mode-medium" class="mode" data-mode="medium" aria-label="Medium: two sparkles"><span class="disc"><svg viewBox="0 0 100 100"><path d="M16 90 L50 56" stroke="#fff" stroke-width="7" stroke-linecap="round"/><g fill="#ffd23f"><use href="#i-spark" x="44" y="14" width="34" height="34"/></g><g fill="#fff"><use href="#i-spark" x="66" y="52" width="24" height="24"/></g></svg></span></button>
      <button id="mode-hard" class="mode" data-mode="hard" aria-label="Hard: three sparkles"><span class="disc"><svg viewBox="0 0 100 100"><path d="M14 92 L44 62" stroke="#fff" stroke-width="7" stroke-linecap="round"/><g fill="#ffd23f"><use href="#i-spark" x="38" y="20" width="32" height="32"/></g><g fill="#fff"><use href="#i-spark" x="66" y="8" width="22" height="22"/><use href="#i-spark" x="66" y="52" width="24" height="24"/></g></svg></span></button>
    </div>
  </div>
  <div id="grid"></div>
  <button id="pgPrev" class="pg" aria-label="Previous page"><span class="btn sm pink"><svg style="transform:scaleX(-1)"><use href="#i-play"/></svg></span></button>
  <div class="dots" id="pgDots"></div>
  <button id="pgNext" class="pg" aria-label="Next page"><span class="btn sm pink"><svg><use href="#i-play"/></svg></span></button>
  <div class="pill"><svg viewBox="0 0 24 24"><use href="#i-coin"/></svg><span id="coinCount">0</span></div>
</div>

<div id="results" class="screen">
  <div class="card">
    <div class="bigstars" id="bigStars"></div>
    <div class="row">
      <button id="resLevels" class="btn md blue" aria-label="Levels"><svg><use href="#i-grid"/></svg></button>
      <button id="resReplay" class="btn md pink" aria-label="Play again"><svg><use href="#i-replay"/></svg></button>
      <button id="resNext" class="btn" aria-label="Next level"><svg><use href="#i-next"/></svg></button>
    </div>
  </div>
</div>

<button id="home" aria-label="Home"><span class="btn sm blue"><svg><use href="#i-home"/></svg></span></button>
<div id="rotate"><svg viewBox="0 0 24 24"><use href="#i-phone"/></svg></div>

<script src="../../fairy/fairy.js"></script>
<script src="logic.js"></script>
<script src="art.js"></script>
<script src="sound.js"></script>
<script src="game.js"></script>
</body>
</html>
