<!-- Fairy Flight: the title-screen button's picture, in the style of the other symbols in web/index.html
     (a 24 x 24 box, white shapes with a touch of pink and gold, so it reads on any button colour).
     A pair of fairy wings with a gold sparkle between them.
     To wire it in: paste the <symbol> into the <defs> of web/index.html and add one line to GAMES in web/hub.js
     (id 'flight', page 'games/flight/index.html', symbol 'i-flight', world 'fairy'). -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-flight" viewBox="0 0 24 24"><path d="M11.3 13C10 7 5.2 3 2.4 4.6 0.9 7.8 4.4 12.6 11.3 13z" fill="#fff"/><path d="M12.7 13C14 7 18.8 3 21.6 4.6 23.1 7.8 19.6 12.6 12.7 13z" fill="#fff"/><path d="M11.3 14C7.9 13.9 4 15.4 4.5 19.1 8.1 21 10.9 17.9 11.3 14z" fill="#fff" opacity=".92"/><path d="M12.7 14C16.1 13.9 20 15.4 19.5 19.1 15.9 21 13.1 17.9 12.7 14z" fill="#fff" opacity=".92"/><path d="M10.4 12.2C8.2 9.7 6.2 7.7 4.4 6.4M13.6 12.2C15.8 9.7 17.8 7.7 19.6 6.4" stroke="#ff6fb0" stroke-width="1.1" stroke-linecap="round" fill="none"/><rect x="11.1" y="10.2" width="1.8" height="11.2" rx=".9" fill="#ff6fb0"/><path d="M12 1 13.1 3.6 15.7 4.7 13.1 5.8 12 8.4 10.9 5.8 8.3 4.7 10.9 3.6z" fill="#ffd23f"/></symbol>
  </defs>
