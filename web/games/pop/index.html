<!doctype html>
<!-- Isabella's Bubble Party: a calm popping-and-counting game for ages 3-5 (no words, no timers, no losing).
     Standalone page; the hub links here and the home button / Android back button return to ../../index.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Isabella's Bubble Party</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#1f8fc0; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  /* round home button, top-left: a 19vh touch area around a 15vh picture */
  #home { position:fixed; top:2vh; left:max(2.5vw, env(safe-area-inset-left)); width:19vh; height:19vh; padding:0; border:none; background:none;
    cursor:pointer; display:flex; align-items:center; justify-content:center; touch-action:manipulation; z-index:2; }
  #home span { width:15vh; height:15vh; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 28%, #c9f3ff, #4cc9f0 55%, #1b7fb8);
    box-shadow:0 1.3vh 0 #145f8a, 0 2.5vh 4vh rgba(0,0,0,0.3); transition:transform .08s; }
  #home:active span { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #145f8a; }
  #home svg { width:58%; height:58%; fill:#fff; filter:drop-shadow(0 .4vh 0 rgba(0,0,0,0.25)); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="home" aria-label="Home"><span><svg viewBox="0 0 24 24"><path d="M12 2.5 1.5 12H5v9h5.5v-6h3v6H19v-9h3.5z"/></svg></span></button>
<script src="art.js"></script>
<script src="sound.js"></script>
<script src="game.js"></script>
</body>
</html>
