<!doctype html>
<!-- Sea Words: a word search for little ones. Each word comes with its picture; drag a line along the word in the
     letters to find it. Three sizes, picked by picture: one word in a small grid, a few in a bigger one, all fourteen
     in a big one. Every puzzle is new. No words to read, no timers.
     Standalone page; the hub links here, and the home button / Android back button return to ../../index.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sea Words</title>
<link rel="icon" href="data:,">
<style>
  /* Buttons, outlines and the results card follow the main game's web/index.html, Shell Match and Coral Maze. */
  :root { --gold1:#fff1a0; --gold2:#ffc21a; --gold3:#d98a00; }
  html, body { margin:0; height:100%; overflow:hidden; background:#1f8fc0; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family: system-ui, Roboto, sans-serif; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .screen { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; }
  .screen.on { display:flex; }
  button { font:inherit; color:inherit; border:none; padding:0; cursor:pointer; background:none; touch-action:manipulation; }
  .btn { width:24vh; height:24vh; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 28%, var(--gold1), var(--gold2) 55%, var(--gold3));
    box-shadow:0 1.3vh 0 #a86400, 0 2.5vh 4vh rgba(0,0,0,0.3); transition:transform .08s; }
  .btn:active { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #a86400; }
  .btn svg { width:56%; height:56%; fill:#fff; filter:drop-shadow(0 .4vh 0 rgba(150,80,0,0.6)); }
  .btn.md { width:19vh; height:19vh; }
  .btn.sm { width:15vh; height:15vh; }
  .btn.blue { background:radial-gradient(circle at 35% 28%, #c9f3ff, #4cc9f0 55%, #1b7fb8); box-shadow:0 1.3vh 0 #145f8a, 0 2.5vh 4vh rgba(0,0,0,0.3); }
  .btn.blue svg { filter:drop-shadow(0 .4vh 0 rgba(0,0,0,0.25)); }
  .row { display:flex; gap:4vh; align-items:center; justify-content:center; }
  /* Outlines are stacked drop-shadows (-webkit-text-stroke left stray lines inside letters on the Seeker). */
  .ol-brown { filter:drop-shadow(.6vh 0 0 #b0480c) drop-shadow(-.6vh 0 0 #b0480c) drop-shadow(0 .6vh 0 #b0480c) drop-shadow(0 -.6vh 0 #b0480c) drop-shadow(0 1vh 0 rgba(120,30,0,0.35)); }

  /* corner buttons: a small disc inside a full 19vh touch area */
  .corner { position:fixed; width:19vh; height:19vh; display:flex; align-items:center; justify-content:center; z-index:10; }
  .corner .btn { pointer-events:none; }
  .corner:active .btn { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #145f8a; }
  #homeBtn { top:2vh; left:max(2vh, env(safe-area-inset-left)); }
  #modesBtn { top:23vh; left:max(2vh, env(safe-area-inset-left)); display:none; }
  #modesBtn.on { display:flex; }
  #soundBtn { bottom:2vh; left:max(2vh, env(safe-area-inset-left)); }
  #soundBtn .btn { width:13vh; height:13vh; }

  /* the picker: three sizes, shown as a small, a middle and a big grid (no words) */
  .title { position:fixed; top:2.5vh; left:0; right:0; text-align:center; pointer-events:none; }
  .title .t1 { display:inline-block; font-size:min(13vh, 7.4vw); font-weight:900; letter-spacing:.4vh; line-height:1.05;
    background:linear-gradient(180deg,#fff7b0,#ffd23f 45%,#ff9f1c); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .moderow { display:flex; gap:min(7vh, 4vw); align-items:flex-start; justify-content:center; margin-top:10vh; }
  .modecol { display:flex; flex-direction:column; align-items:center; gap:3.5vh; }
  .mode { width:min(32vh, 24vw); height:min(32vh, 24vw); border-radius:50%; display:flex; align-items:center; justify-content:center; border:.7vh solid #fff; box-sizing:border-box;
    box-shadow:0 1.3vh 0 rgba(0,40,80,0.45), inset 0 -2vh 3vh rgba(0,0,0,0.18), inset 0 2vh 2.5vh rgba(255,255,255,0.5); transition:transform .08s; }
  .mode:active { transform:translateY(.8vh) scale(0.98); }
  .mode svg { width:74%; height:74%; overflow:visible; }
  .mode.easy { background:radial-gradient(circle at 35% 28%, #dafff5, #2ec4a6 55%, #138a74); }
  .mode.medium { background:radial-gradient(circle at 35% 28%, #c9f3ff, #4cc9f0 55%, #1b7fb8); }
  .mode.hard { background:radial-gradient(circle at 35% 28%, #f4e3ff, #b46cf0 55%, #7a2fc0); }
  .mode.last { animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-1.6vh) scale(1.03); } }
  .cnt { display:flex; align-items:center; gap:1vh; padding:.9vh 2.6vh .9vh 1.8vh; border-radius:6vh; background:rgba(255,255,255,0.92); color:#c77700;
    font-size:5.5vh; font-weight:900; line-height:1; box-shadow:0 .8vh 0 rgba(0,40,80,0.3); pointer-events:none; }
  .cnt svg { width:6vh; height:6vh; }
  .pill { position:fixed; top:4vh; right:4vh; display:flex; align-items:center; gap:1.2vh; padding:1.4vh 3vh 1.4vh 2vh;
    border-radius:7vh; background:rgba(255,255,255,0.92); color:#c77700; font-size:5.5vh; font-weight:900; box-shadow:0 1vh 0 rgba(0,40,80,0.35); pointer-events:none; }
  .pill svg { width:6.5vh; height:6.5vh; }

  /* results: a card over the letters, so the chest and Isabella stay in view on the right */
  #results { background:rgba(0,30,60,0.2); }
  .card { position:fixed; left:38%; top:50%; transform:translate(-50%,-50%); background:#fff; border-radius:6vh; padding:5.5vh 5vh 5.5vh;
    display:flex; flex-direction:column; align-items:center; gap:4vh; box-shadow:0 2vh 0 rgba(0,40,80,0.3); border:.8vh solid #ffd23f; }
  .trophy { position:absolute; top:-5vh; right:-4vh; display:flex; align-items:center; gap:.8vh; padding:1vh 2.4vh 1vh 1.6vh; border-radius:6vh; background:#fff;
    color:#c77700; font-size:5.5vh; font-weight:900; line-height:1; box-shadow:0 .8vh 0 rgba(0,40,80,0.3); border:.5vh solid #ffd23f; }
  .trophy svg { width:6.5vh; height:6.5vh; }
  .pics { display:flex; gap:2.5vh; align-items:flex-end; }
  .pics .pic { display:flex; flex-direction:column; align-items:center; gap:.6vh; transform:scale(0); }
  .pics .pic.pop { animation:pop .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  .pics canvas { width:15vh; height:15vh; display:block; }
  .pics .word { font-size:4.4vh; font-weight:900; color:#1d3557; letter-spacing:.3vh; line-height:1; }
  .pics.big canvas { width:27vh; height:27vh; }
  .pics.big .word { font-size:8vh; letter-spacing:.8vh; }
  .bigstars { display:flex; gap:3vh; }
  .bigstars svg { width:17vh; height:17vh; transform:scale(0); }
  .bigstars svg.pop { animation:pop .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes pop { to { transform:scale(1); } }
  #resNext { animation:nudge 1.8s ease-in-out 1.6s infinite; }
  @keyframes nudge { 0%, 70%, 100% { transform:scale(1); } 80% { transform:scale(1.08); } 90% { transform:scale(0.98); } }

  /* held upright? (the Android app is always landscape) */
  #rotate { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#1f8fc0; z-index:20; }
  #rotate svg { width:40vw; height:40vw; fill:#fff; animation:turn 2s ease-in-out infinite; }
  @keyframes turn { 0%,25% { transform:rotate(0); } 60%,100% { transform:rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 2.5 1.5 12H5v9h5.5v-6h3v6H19v-9h3.5z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M3 4v16l9-8zM12 4v16l9-8z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3.6"/><circle cx="18" cy="6" r="3.6"/><circle cx="6" cy="18" r="3.6"/><circle cx="18" cy="18" r="3.6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1L1.7 9.2l7.2-.8z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM16 7.5a6 6 0 0 1 0 9l-1.4-1.4a4 4 0 0 0 0-6.2zM18.8 4.7a10 10 0 0 1 0 14.6l-1.4-1.4a8 8 0 0 0 0-11.8z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM15 8.4l1.4-1.4 2.6 2.6 2.6-2.6L23 8.4l-2.6 2.6 2.6 2.6-1.4 1.4-2.6-2.6-2.6 2.6-1.4-1.4 2.6-2.6z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 1h10a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2zm0 3v15h10V4z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><g fill="#ffd23f" stroke="#b86e00" stroke-width="1.3" stroke-linejoin="round"><path d="M6.6 5.2H3.6v1.6a3.8 3.8 0 0 0 3.6 3.8M17.4 5.2h3v1.6a3.8 3.8 0 0 1-3.6 3.8" fill="none" stroke-width="1.6"/><path d="M6.5 3h11v5a5.5 5.5 0 0 1-11 0z"/><path d="M10.6 13.2h2.8v3.6h-2.8z"/><path d="M7.4 16.8h9.2v3.6H7.4z"/></g><path d="M9 4.6v3.2" stroke="#fff6c0" stroke-width="1.4" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="modes" class="screen on">
  <div class="title"><span class="t1 ol-brown" id="title">Sea Words</span></div>
  <div class="moderow">
    <div class="modecol">
      <!-- small: a 3 x 3 grid with one word -->
      <button id="mode-easy" class="mode easy" data-mode="easy" aria-label="Small puzzle: one picture word">
        <svg viewBox="0 0 100 100"><g fill="#fff">
          <rect x="14" y="14" width="20" height="20" rx="5"/><rect x="40" y="14" width="20" height="20" rx="5"/><rect x="66" y="14" width="20" height="20" rx="5"/>
          <rect x="14" y="40" width="20" height="20" rx="5"/><rect x="40" y="40" width="20" height="20" rx="5"/><rect x="66" y="40" width="20" height="20" rx="5"/>
          <rect x="14" y="66" width="20" height="20" rx="5"/><rect x="40" y="66" width="20" height="20" rx="5"/><rect x="66" y="66" width="20" height="20" rx="5"/></g>
          <rect x="9" y="37" width="82" height="26" rx="13" fill="#ff6fb0" fill-opacity=".8" stroke="#fff" stroke-width="2.4"/>
        </svg>
      </button>
      <div class="cnt"><svg viewBox="0 0 24 24"><use href="#i-trophy"/></svg><span id="cnt-easy">0</span></div>
    </div>
    <div class="modecol">
      <!-- middle: a 4 x 4 grid with two words, one of them diagonal -->
      <button id="mode-medium" class="mode medium" data-mode="medium" aria-label="Middle puzzle: a few picture words">
        <svg viewBox="0 0 100 100"><g fill="#fff">
          <rect x="13" y="13" width="15" height="15" rx="4"/><rect x="32.5" y="13" width="15" height="15" rx="4"/><rect x="52" y="13" width="15" height="15" rx="4"/><rect x="71.5" y="13" width="15" height="15" rx="4"/>
          <rect x="13" y="32.5" width="15" height="15" rx="4"/><rect x="32.5" y="32.5" width="15" height="15" rx="4"/><rect x="52" y="32.5" width="15" height="15" rx="4"/><rect x="71.5" y="32.5" width="15" height="15" rx="4"/>
          <rect x="13" y="52" width="15" height="15" rx="4"/><rect x="32.5" y="52" width="15" height="15" rx="4"/><rect x="52" y="52" width="15" height="15" rx="4"/><rect x="71.5" y="52" width="15" height="15" rx="4"/>
          <rect x="13" y="71.5" width="15" height="15" rx="4"/><rect x="32.5" y="71.5" width="15" height="15" rx="4"/><rect x="52" y="71.5" width="15" height="15" rx="4"/><rect x="71.5" y="71.5" width="15" height="15" rx="4"/></g>
          <rect x="9" y="10.5" width="82" height="20" rx="10" fill="#ffd23f" fill-opacity=".85" stroke="#fff" stroke-width="2.2"/>
          <rect x="-37.6" y="-10" width="75.2" height="20" rx="10" transform="translate(40.25 59.75) rotate(45)" fill="#ff6fb0" fill-opacity=".8" stroke="#fff" stroke-width="2.2"/>
        </svg>
      </button>
      <div class="cnt"><svg viewBox="0 0 24 24"><use href="#i-trophy"/></svg><span id="cnt-medium">0</span></div>
    </div>
    <div class="modecol">
      <!-- big: a 6 x 6 grid with three words: across, down and diagonal -->
      <button id="mode-hard" class="mode hard" data-mode="hard" aria-label="Big puzzle: all the picture words">
        <svg viewBox="0 0 100 100"><g fill="#fff" id="hardTiles"></g>
          <rect x="7" y="23" width="86" height="14" rx="7" fill="#ffd23f" fill-opacity=".85" stroke="#fff" stroke-width="1.8"/>
          <rect x="63.4" y="36" width="14" height="57" rx="7" fill="#5ad17a" fill-opacity=".85" stroke="#fff" stroke-width="1.8"/>
          <rect x="-35.9" y="-7" width="71.8" height="14" rx="7" transform="translate(36.4 63.6) rotate(45)" fill="#ff6fb0" fill-opacity=".85" stroke="#fff" stroke-width="1.8"/>
        </svg>
      </button>
      <div class="cnt"><svg viewBox="0 0 24 24"><use href="#i-trophy"/></svg><span id="cnt-hard">0</span></div>
    </div>
  </div>
  <div class="pill"><svg viewBox="0 0 24 24"><use href="#i-star" fill="#ffd23f" stroke="#c77700" stroke-width="1.5"/></svg><span id="starCount">0</span></div>
  <button id="soundBtn" class="corner" aria-label="Sound"><span class="btn blue"><svg><use href="#i-sound"/></svg></span></button>
</div>

<div id="results" class="screen">
  <div class="card" id="resCard">
    <div class="trophy"><svg viewBox="0 0 24 24"><use href="#i-trophy"/></svg><span id="resCount">0</span></div>
    <div id="resPics" class="pics"></div>
    <div class="bigstars" id="bigStars"></div>
    <div class="row">
      <button id="resModes" class="btn md blue" aria-label="Choose a size"><svg><use href="#i-grid"/></svg></button>
      <button id="resNext" class="btn" aria-label="Next puzzle"><svg><use href="#i-next"/></svg></button>
    </div>
  </div>
</div>

<button id="homeBtn" class="corner" aria-label="Home"><span class="btn sm blue"><svg><use href="#i-home"/></svg></span></button>
<button id="modesBtn" class="corner" aria-label="Choose a size"><span class="btn sm blue"><svg><use href="#i-grid"/></svg></span></button>
<div id="rotate"><svg viewBox="0 0 24 24"><use href="#i-phone"/></svg></div>

<script src="blocklist.js"></script>
<script src="logic.js"></script>
<script src="art.js"></script>
<script src="sound.js"></script>
<script src="game.js"></script>
</body>
</html>
