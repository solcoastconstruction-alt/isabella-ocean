<!doctype html>
<!-- Potion Colours (Isabella the Fairy): a colour-mixing puzzle for ages 3-8, no words, no timers.
     A grey flower wants a colour (a big swatch in its thought bubble). Pour one, two or three bottles into the
     cauldron (drag a bottle over it, or just tap it), the colours mix, and if they match the flower blooms.
     Easy, Medium and Hard; twenty levels in two worlds; the treasure chest at the end of every level.
     Standalone page; the hub links here and the home button / Android back button return to ../../index.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Potion Colours</title>
<link rel="icon" href="data:,">
<style>
  /* Buttons, the level map and the results card follow the other games (Bubble Party, Sea Jigsaw) and the main game. */
  :root { --gold1:#fff1a0; --gold2:#ffc21a; --gold3:#d98a00; }
  html, body { margin:0; height:100%; overflow:hidden; background:#c86bfa; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family: system-ui, Roboto, sans-serif; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .screen { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; }
  .screen.on { display:flex; }
  button { font:inherit; color:inherit; border:none; padding:0; cursor:pointer; background:none; touch-action:manipulation; }
  .btn { width:24vh; height:24vh; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 28%, var(--gold1), var(--gold2) 55%, var(--gold3));
    box-shadow:0 1.3vh 0 #a86400; transition:transform .08s; }
  .btn:active { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #a86400; }
  .btn svg { width:56%; height:56%; fill:#fff; }
  .btn.md { width:19vh; height:19vh; }
  .btn.sm { width:15vh; height:15vh; }
  .btn.pink { background:radial-gradient(circle at 35% 28%, #ffd1ea, #ff6fb0 55%, #d63384); box-shadow:0 1.3vh 0 #9c1f5c; }
  .btn.violet { background:radial-gradient(circle at 35% 28%, #f4e3ff, #b46cf0 55%, #7a2fc0); box-shadow:0 1.3vh 0 #55208a; }
  .row { display:flex; gap:4vh; align-items:center; justify-content:center; }
  /* Outlines are stacked hard text-shadows (no blur anywhere in this game). */
  .ol-brown { text-shadow:.6vh 0 0 #6a2a8a, -.6vh 0 0 #6a2a8a, 0 .6vh 0 #6a2a8a, 0 -.6vh 0 #6a2a8a, .45vh .45vh 0 #6a2a8a, -.45vh .45vh 0 #6a2a8a, .45vh -.45vh 0 #6a2a8a, -.45vh -.45vh 0 #6a2a8a, 0 1vh 0 rgba(60,10,90,0.4); }
  .ol-navy { text-shadow:.3vh 0 0 rgba(60,10,90,0.85), -.3vh 0 0 rgba(60,10,90,0.85), 0 .3vh 0 rgba(60,10,90,0.85), 0 -.3vh 0 rgba(60,10,90,0.85); }

  /* corner buttons: a small disc inside a full 19vh touch area, down the left edge */
  .corner { position:fixed; left:max(1.2vh, env(safe-area-inset-left)); width:19vh; height:19vh; display:none; align-items:center; justify-content:center; z-index:10; }
  .corner.on { display:flex; }
  .corner .btn { pointer-events:none; }
  .corner:active .btn { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #55208a; }
  #homeBtn { top:1.5vh; display:flex; }
  #gridBtn { top:21.5vh; }

  /* level map: the name and the three modes along the top, then ten levels, then the page arrows with the dots */
  .title { position:fixed; top:.5vh; left:22vh; right:min(34vh, 18vw); height:21vh; display:flex; align-items:center; justify-content:center; gap:min(3vh, 1.6vw); pointer-events:none; }
  .title .t1 { display:inline-block; pointer-events:auto; font-size:min(10vh, 4.6vw); font-weight:900; letter-spacing:.3vh; line-height:1.05; white-space:nowrap; margin-right:min(2vh, 1vw);
    color:#ffd23f; }
  /* the mode, in pictures: a wand with one, two or three sparkles. The one in play is bright, bigger and ringed in gold. */
  .mode { width:19vh; height:19vh; flex:none; display:flex; align-items:center; justify-content:center; pointer-events:auto; }
  .mode .disc { width:15.5vh; height:15.5vh; border-radius:50%; display:flex; align-items:center; justify-content:center; box-sizing:border-box;
    border:.6vh solid rgba(255,255,255,0.55); box-shadow:0 1vh 0 rgba(60,10,90,0.35); transition:transform .15s; opacity:.7; }
  .mode .disc svg { width:80%; height:80%; }
  #mode-easy .disc { background:radial-gradient(circle at 35% 28%, #dafff5, #2ec4a6 55%, #138a74); }
  #mode-medium .disc { background:radial-gradient(circle at 35% 28%, #c9f3ff, #4cc9f0 55%, #1b7fb8); }
  #mode-hard .disc { background:radial-gradient(circle at 35% 28%, #f4e3ff, #b46cf0 55%, #7a2fc0); }
  .mode.on .disc { opacity:1; transform:scale(1.12); border-color:#fff; box-shadow:0 0 0 .8vh rgba(255,210,63,0.95), 0 1.3vh 0 rgba(60,10,90,0.45); }
  .mode:active .disc { transform:scale(1.04) translateY(.8vh); }
  .pill { position:fixed; top:4vh; right:max(3vh, env(safe-area-inset-right)); display:flex; align-items:center; gap:1.2vh; padding:1.4vh 3vh 1.4vh 2vh;
    border-radius:7vh; background:rgba(255,255,255,0.92); color:#c77700; font-size:5.5vh; font-weight:900; line-height:1; box-shadow:0 1vh 0 rgba(60,10,90,0.35); pointer-events:none; }
  .pill svg { width:6.5vh; height:6.5vh; }
  @media (max-aspect-ratio: 18/10) { .title .t1 { font-size:min(8vh, 3.4vw); } }
  /* squarer screens (tablets): no room for the name beside the three modes, the home button and the coin count */
  @media (max-aspect-ratio: 16/10) { .title .t1 { display:none; } .title { left:22vh; right:34vh; } .pill { font-size:4.6vh; } }

  #levels { justify-content:flex-start; }
  #grid { --w:min(21vh, calc((100vw - 8vw) / 5.5)); display:grid; grid-template-columns:repeat(5, var(--w)); gap:min(2.6vh, 2vw) min(3.6vh, 2.4vw); margin-top:22.5vh; }
  .lvl { width:var(--w); height:var(--w); border-radius:50%; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 1.1vh 0 rgba(60,10,90,0.45), inset 0 -1.5vh 0 rgba(0,0,0,0.12), inset 0 1.5vh 0 rgba(255,255,255,0.35); border:.6vh solid #fff; box-sizing:border-box; }
  .lvl:active { transform:translateY(.8vh); }
  .lvl .num { font-size:calc(var(--w) * 0.42); font-weight:900; color:#fff; line-height:1; }
  .lvl .st { display:flex; gap:.2vh; margin-top:.4vh; }
  .lvl .st svg { width:calc(var(--w) * 0.2); height:calc(var(--w) * 0.2); }
  .lvl.locked { filter:grayscale(0.85) brightness(0.72); }
  .lvl.locked .num, .lvl.locked .st { display:none; }
  .lvl .lock { width:calc(var(--w) * 0.4); height:calc(var(--w) * 0.4); fill:#fff; display:none; }
  .lvl.locked .lock { display:block; }
  .lvl.shake { animation:shake .4s; }
  .lvl.next { animation:bob 1.6s ease-in-out infinite; border-color:#ffd23f; }
  @keyframes bob { 50% { transform:translateY(-1.4vh) scale(1.04); } }
  @keyframes shake { 20%,60% { transform:translateX(-1.5vh); } 40%,80% { transform:translateX(1.5vh); } }
  /* page arrows and dots, along the bottom (so the map can be as wide as the screen even on a squarer tablet) */
  .pager { position:fixed; left:0; right:0; bottom:1vh; display:flex; align-items:center; justify-content:center; gap:3vh; }
  .pg { width:19vh; height:19vh; display:flex; align-items:center; justify-content:center; }
  .pg .btn { pointer-events:none; }
  .pg:active .btn { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #9c1f5c; }
  .pg.off { visibility:hidden; }
  .world { display:flex; align-items:center; gap:2.2vh; padding:1.4vh 3vh; border-radius:7vh; background:rgba(255,255,255,0.88); box-shadow:0 .8vh 0 rgba(60,10,90,0.3); pointer-events:none; }
  .world svg { width:8vh; height:8vh; }
  .dots { display:flex; gap:1.8vh; }
  .dots span { width:2.8vh; height:2.8vh; border-radius:50%; background:rgba(120,70,170,0.3); }
  .dots span.on { background:#b46cf0; }

  /* results: a card off to the right, so the open chest and Isabella stay in view on the left */
  #results { background:rgba(60,10,90,0.12); }
  .card { position:fixed; left:68%; top:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,0.94); border-radius:6vh; padding:5vh 5vh 6vh;
    display:flex; flex-direction:column; align-items:center; gap:5vh; box-shadow:0 2vh 0 rgba(60,10,90,0.3); border:.8vh solid #ffd23f; }
  .bigstars { display:flex; gap:3vh; }
  .bigstars svg { width:17vh; height:17vh; transform:scale(0); }
  .bigstars svg.pop { animation:pop .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes pop { to { transform:scale(1); } }
  .won { display:flex; align-items:center; gap:1.2vh; padding:1vh 3.4vh 1vh 2.2vh; border-radius:7vh; background:#fff6d0; color:#c77700; font-size:8vh; font-weight:900; line-height:1; border:.5vh solid #ffd23f; }
  .won svg { width:9vh; height:9vh; }
  #resNext { animation:nudge 1.8s ease-in-out 1.6s infinite; }
  @keyframes nudge { 0%, 70%, 100% { transform:scale(1); } 80% { transform:scale(1.08); } 90% { transform:scale(0.98); } }

  /* held upright? (the Android app is always landscape) */
  #rotate { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#8e3fd0; z-index:20; }
  #rotate svg { width:40vw; height:40vw; fill:#fff; animation:turn 2s ease-in-out infinite; }
  @keyframes turn { 0%,25% { transform:rotate(0); } 60%,100% { transform:rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 2.5 1.5 12H5v9h5.5v-6h3v6H19v-9h3.5z"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M12 4V0L6 6l6 6V8a6 6 0 1 1-6 6H3a9 9 0 1 0 9-10z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M3 4v16l9-8zM12 4v16l9-8z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3.6"/><circle cx="18" cy="6" r="3.6"/><circle cx="6" cy="18" r="3.6"/><circle cx="18" cy="18" r="3.6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1L1.7 9.2l7.2-.8z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M12 1.5a5.5 5.5 0 0 0-5.5 5.5v3H4.5v12.5h15V10h-2V7A5.5 5.5 0 0 0 12 1.5zM9 10V7a3 3 0 0 1 6 0v3z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 1h10a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2zm0 3v15h10V4z"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12.8" r="10.5" fill="#c98a00"/><circle cx="12" cy="11.8" r="10.5" fill="#ffd633"/><circle cx="8.6" cy="8" r="3.4" fill="#fff6b0" opacity=".7"/><circle cx="12" cy="11.8" r="7" fill="none" stroke="#b46e00" stroke-width="1.2" opacity=".75"/><path d="M12 7.3l1.4 2.9 3.2.4-2.4 2.2.7 3.2-2.9-1.6-2.9 1.6.7-3.2-2.4-2.2 3.2-.4z" fill="#c87d00" opacity=".85"/></symbol>
    <!-- World 1 (the Meadow): a flower. World 2 (the Cloud Tops): a cloud. -->
    <symbol id="i-flower" viewBox="0 0 24 24"><g fill="#ff8fc0"><circle cx="12" cy="5.5" r="4"/><circle cx="18.2" cy="10" r="4"/><circle cx="15.8" cy="17.3" r="4"/><circle cx="8.2" cy="17.3" r="4"/><circle cx="5.8" cy="10" r="4"/></g><circle cx="12" cy="12" r="3.8" fill="#ffd633"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M6.5 19a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.6 9.4 4.8 4.8 0 0 1 17.5 19z" fill="#8fd3ff"/><path d="M9 8.6a4 4 0 0 1 5.2-.6" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="levels" class="screen on">
  <div class="title">
    <span class="t1 ol-brown" id="title">Potion Colours</span>
    <!-- Easy: a wand with one sparkle. Medium: two. Hard: three. -->
    <button id="mode-easy" class="mode" data-mode="easy" aria-label="Easy"><span class="disc"></span></button>
    <button id="mode-medium" class="mode" data-mode="medium" aria-label="Medium"><span class="disc"></span></button>
    <button id="mode-hard" class="mode" data-mode="hard" aria-label="Hard"><span class="disc"></span></button>
  </div>
  <div id="grid"></div>
  <div class="pill"><svg viewBox="0 0 24 24"><use href="#i-coin"/></svg><span id="coinCount">0</span></div>
  <div class="pager">
    <button id="pgPrev" class="pg" aria-label="Back"><span class="btn sm pink"><svg style="transform:scaleX(-1)"><use href="#i-play"/></svg></span></button>
    <div class="world"><svg id="worldIcon" viewBox="0 0 24 24"><use href="#i-flower"/></svg><div class="dots" id="pgDots"></div></div>
    <button id="pgNext" class="pg" aria-label="Next"><span class="btn sm pink"><svg><use href="#i-play"/></svg></span></button>
  </div>
</div>

<div id="results" class="screen">
  <div class="card" id="resCard">
    <div class="bigstars" id="bigStars"></div>
    <div class="won"><svg viewBox="0 0 24 24"><use href="#i-coin"/></svg><span id="resCoins">0</span></div>
    <div class="row">
      <button id="resLevels" class="btn md violet" aria-label="Levels"><svg><use href="#i-grid"/></svg></button>
      <button id="resReplay" class="btn md pink" aria-label="Play again"><svg><use href="#i-replay"/></svg></button>
      <button id="resNext" class="btn" aria-label="Next level"><svg><use href="#i-next"/></svg></button>
    </div>
  </div>
</div>

<button id="homeBtn" class="corner" aria-label="Home"><span class="btn sm violet"><svg><use href="#i-home"/></svg></span></button>
<button id="gridBtn" class="corner" aria-label="Levels"><span class="btn sm violet"><svg><use href="#i-grid"/></svg></span></button>
<div id="rotate"><svg viewBox="0 0 24 24"><use href="#i-phone"/></svg></div>

<script src="../../fairy/fairy.js"></script>
<script src="logic.js"></script>
<script src="art.js"></script>
<script src="sound.js"></script>
<script src="game.js"></script>
</body>
</html>
