<!-- Toadstool Hop: the title-screen button's picture, in the style of the other symbols in web/index.html
     (a 24 x 24 box, white shapes with a touch of pink and gold, so it reads on any button colour).
     A toadstool (white cap with pink spots) with a dotted hop arc over it and a gold sparkle.
     To wire it in: paste the <symbol> into the <defs> of web/index.html and add
       <button id="hopBtn" class="btn game ..." aria-label="Toadstool Hop"><svg viewBox="0 0 24 24"><use href="#i-hop"/></svg></button> -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-hop" viewBox="0 0 24 24"><path d="M2.4 8.6C4 4.2 7.4 2.4 11.4 4.2" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="0.1 2.6" fill="none"/><path d="M9.6 17.2c.5 1.6.5 3.1-.1 4.4h5.6c-.6-1.3-.6-2.8-.1-4.4z" fill="#fff"/><path d="M3.2 17.4C3.2 11.6 7 9 12.2 9s8.6 2.6 8.6 8.4c0 .5-.4.8-.9.8H4.1c-.5 0-.9-.3-.9-.8z" fill="#fff"/><circle cx="8" cy="13.8" r="1.7" fill="#ff6fb0"/><circle cx="13.2" cy="12.2" r="2" fill="#ff6fb0"/><circle cx="17.4" cy="15" r="1.5" fill="#ff6fb0"/><path d="M19 1.2l1.1 2.6 2.6 1.1-2.6 1.1L19 8.6l-1.1-2.6-2.6-1.1 2.6-1.1z" fill="#ffd23f"/></symbol>
  </defs>
</svg>
