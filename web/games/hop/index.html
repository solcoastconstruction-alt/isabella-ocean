<!doctype html>
<!-- Toadstool Hop: a timing game for ages 3-8 (no words, no timers shown, nothing to fail).
     Isabella the Fairy stands on a toadstool by a waterfall. A tap anywhere makes her hop to the next platform: toadstools stand
     still, lily pads drift sideways, little clouds float up and down. A hop that is too far splashes her into the river, a friendly
     frog boosts her back, and that is all. Coins sit on platforms, butterflies float over gaps, a key waits in the second half and
     opens the treasure chest at the end. Easy, Medium and Hard; two worlds of ten levels (docs/fairy/hop.md).
     Standalone page; the hub links here and the home button / Android back button return to ../../index.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Toadstool Hop</title>
<link rel="icon" href="data:,">
<style>
  :root { --gold1:#fff1a0; --gold2:#ffc21a; --gold3:#d98a00; }
  html, body { margin:0; height:100%; overflow:hidden; background:#7fd6c6; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family: system-ui, Roboto, sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .screen { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; }
  .screen.on { display:flex; }
  button { font:inherit; color:inherit; border:none; padding:0; cursor:pointer; background:none; touch-action:manipulation; }
  .btn { width:24vh; height:24vh; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 28%, var(--gold1), var(--gold2) 55%, var(--gold3));
    box-shadow:0 1.3vh 0 #a86400, 0 2.5vh 4vh rgba(0,0,0,0.3); transition:transform .08s; }
  .btn:active { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #a86400; }
  .btn svg { width:56%; height:56%; fill:#fff; filter:drop-shadow(0 .4vh 0 rgba(150,80,0,0.6)); }
  .btn.md { width:19vh; height:19vh; }
  .btn.sm { width:15vh; height:15vh; }
  .btn.pink { background:radial-gradient(circle at 35% 28%, #ffd1ea, #ff6fb0 55%, #d63384); box-shadow:0 1.3vh 0 #9c1f5c, 0 2.5vh 4vh rgba(0,0,0,0.3); }
  .btn.blue { background:radial-gradient(circle at 35% 28%, #c9f3ff, #4cc9f0 55%, #1b7fb8); box-shadow:0 1.3vh 0 #145f8a, 0 2.5vh 4vh rgba(0,0,0,0.3); }
  .btn.pink svg, .btn.blue svg { filter:drop-shadow(0 .4vh 0 rgba(0,0,0,0.25)); }
  .row { display:flex; gap:4vh; align-items:center; justify-content:center; }
  .ol-brown { filter:drop-shadow(.6vh 0 0 #b0480c) drop-shadow(-.6vh 0 0 #b0480c) drop-shadow(0 .6vh 0 #b0480c) drop-shadow(0 -.6vh 0 #b0480c) drop-shadow(0 1vh 0 rgba(120,30,0,0.35)); }
  .ol-navy { filter:drop-shadow(.35vh 0 0 rgba(0,40,80,0.75)) drop-shadow(-.35vh 0 0 rgba(0,40,80,0.75)) drop-shadow(0 .35vh 0 rgba(0,40,80,0.75)) drop-shadow(0 -.35vh 0 rgba(0,40,80,0.75)); }

  /* home: a 15vh disc inside a 19vh touch area, top left, on every screen */
  #home { position:fixed; top:2vh; left:max(2.5vw, env(safe-area-inset-left)); width:19vh; height:19vh; display:flex; align-items:center; justify-content:center; z-index:10; }
  #home .btn { pointer-events:none; }
  #home:active .btn { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #145f8a; }

  /* level select: the name and the three modes along the top, then ten numbered bubbles with stars, two pages */
  .title { position:fixed; top:.5vh; left:22vh; right:min(34vh, 18vw); height:21vh; display:flex; align-items:center; justify-content:center; gap:min(3vh, 1.6vw); pointer-events:none; }
  .title .t1 { display:inline-block; pointer-events:auto; font-size:min(11vh, 5.2vw); font-weight:900; letter-spacing:.3vh; line-height:1.05; white-space:nowrap; margin-right:min(2vh, 1vw);
    background:linear-gradient(180deg,#fff7b0,#ffd23f 45%,#ff9f1c); -webkit-background-clip:text; background-clip:text; color:transparent; }
  /* the mode, in pictures: a wand with one sparkle, two, three. The one in play is bright, bigger and ringed in gold. Each is a full 19vh target. */
  .mode { width:19vh; height:19vh; flex:none; display:flex; align-items:center; justify-content:center; pointer-events:auto; }
  .mode .disc { width:15.5vh; height:15.5vh; border-radius:50%; display:flex; align-items:center; justify-content:center; box-sizing:border-box;
    border:.6vh solid rgba(255,255,255,0.55); box-shadow:0 1vh 0 rgba(0,40,80,0.35); transition:transform .15s, filter .15s; filter:saturate(0.35) brightness(0.82); opacity:.85; }
  .mode .disc svg { width:76%; height:76%; }
  #mode-easy .disc { background:radial-gradient(circle at 35% 28%, #dafff5, #2ec4a6 55%, #138a74); }
  #mode-medium .disc { background:radial-gradient(circle at 35% 28%, #c9f3ff, #4cc9f0 55%, #1b7fb8); }
  #mode-hard .disc { background:radial-gradient(circle at 35% 28%, #f4e3ff, #b46cf0 55%, #7a2fc0); }
  .mode.on .disc { filter:none; opacity:1; transform:scale(1.12); border-color:#fff; box-shadow:0 0 0 .8vh rgba(255,210,63,0.95), 0 1.3vh 0 rgba(0,40,80,0.45); }
  .mode:active .disc { transform:scale(1.04) translateY(.8vh); }
  #grid { display:grid; grid-template-columns:repeat(5, 23vh); gap:3.5vh 4.5vh; margin-top:14vh; }
  .lvl { width:23vh; height:23vh; border-radius:50%; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 1.1vh 0 rgba(0,40,80,0.45), inset 0 -1.5vh 3vh rgba(0,0,0,0.2), inset 0 1.5vh 2vh rgba(255,255,255,0.5); border:.6vh solid #fff; }
  .lvl:active { transform:translateY(.8vh); }
  .lvl .num { font-size:9vh; font-weight:900; color:#fff; line-height:1; }
  .lvl .st { display:flex; gap:.3vh; margin-top:.6vh; }
  .lvl .st svg { width:4.8vh; height:4.8vh; }
  .lvl.locked { filter:grayscale(0.8) brightness(0.75); }
  .lvl.locked .num, .lvl.locked .st { display:none; }
  .lvl .lock { width:9vh; height:9vh; fill:#fff; display:none; }
  .lvl.locked .lock { display:block; }
  .lvl.shake { animation:shake .4s; }
  .lvl.next { animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-1.6vh) scale(1.04); } }
  @keyframes shake { 20%,60% { transform:translateX(-1.5vh); } 40%,80% { transform:translateX(1.5vh); } }
  .pg-l { position:fixed; left:5vw; top:58%; transform:translateY(-50%); }
  .pg-r { position:fixed; right:5vw; top:58%; transform:translateY(-50%); }
  .pg-l:active, .pg-r:active { transform:translateY(-50%) scale(0.95); }
  .pg-l svg { transform:scaleX(-1); }
  @media (max-aspect-ratio: 16/10) {
    #grid { grid-template-columns:repeat(5, 11vw); gap:3vh 2.4vw; margin-top:9vh; }
    .lvl { width:11vw; height:11vw; }
    .lvl .num { font-size:min(9vh, 5vw); }
    .pg-l { left:2vw; } .pg-r { right:2vw; }
    .title { left:19vh; right:21vw; gap:1.2vw; }
    .title .t1 { font-size:min(9vh, 4.2vw); margin-right:0; }
    .mode { width:min(19vh, 9vw); height:min(19vh, 9vw); }
    .mode .disc { width:min(15.5vh, 7.4vw); height:min(15.5vh, 7.4vw); }
    .pill { font-size:min(5.5vh, 3.2vw); }
    .pill svg { width:min(6.5vh, 3.8vw); height:min(6.5vh, 3.8vw); }
  }
  .dots { position:fixed; bottom:3.5vh; left:0; right:0; display:flex; gap:2vh; justify-content:center; pointer-events:none; }
  .dots span { width:2.6vh; height:2.6vh; border-radius:50%; background:rgba(255,255,255,0.5); box-shadow:0 .4vh 0 rgba(0,40,80,0.3); }
  .dots span.on { background:#fff; }
  .pill { position:fixed; top:4vh; right:max(3vh, env(safe-area-inset-right)); display:flex; align-items:center; gap:1.2vh; padding:1.4vh 3vh 1.4vh 2vh;
    border-radius:7vh; background:rgba(255,255,255,0.92); color:#c77700; font-size:5.5vh; font-weight:900; line-height:1; box-shadow:0 1vh 0 rgba(0,40,80,0.35); pointer-events:none; }
  .pill svg { width:6.5vh; height:6.5vh; }
  #hud { display:none; }
  #hud.on { display:flex; }
  #hud .key { display:none; width:8vh; height:4vh; }
  #hud .key.on { display:block; }

  /* results: a card off to the right, so the open chest and Isabella stay in view on the left */
  #results { background:rgba(0,30,60,0.14); }
  .card { position:fixed; left:68%; top:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,0.93); border-radius:6vh; padding:4.5vh 5vh 5.5vh;
    display:flex; flex-direction:column; align-items:center; gap:3.5vh; box-shadow:0 2vh 0 rgba(0,40,80,0.3); border:.8vh solid #ffd23f; }
  .bigstars { display:flex; gap:3vh; }
  .bigstars svg { width:15vh; height:15vh; transform:scale(0); }
  .bigstars svg.pop { animation:pop .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes pop { to { transform:scale(1); } }
  .won { display:flex; align-items:center; gap:1.6vh; color:#c77700; font-size:8vh; font-weight:900; line-height:1; }
  .won svg { width:8vh; height:8vh; }

  /* held upright? (the Android app is always landscape) */
  #rotate { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#7fd6c6; z-index:20; }
  #rotate svg { width:40vw; height:40vw; fill:#fff; animation:turn 2s ease-in-out infinite; }
  @keyframes turn { 0%,25% { transform:rotate(0); } 60%,100% { transform:rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 2.5 1.5 12H5v9h5.5v-6h3v6H19v-9h3.5z"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M12 4V0L6 6l6 6V8a6 6 0 1 1-6 6H3a9 9 0 1 0 9-10z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M3 4v16l9-8zM12 4v16l9-8z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3.6"/><circle cx="18" cy="6" r="3.6"/><circle cx="6" cy="18" r="3.6"/><circle cx="18" cy="18" r="3.6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1L1.7 9.2l7.2-.8z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M12 1.5a5.5 5.5 0 0 0-5.5 5.5v3H4.5v12.5h15V10h-2V7A5.5 5.5 0 0 0 12 1.5zM9 10V7a3 3 0 0 1 6 0v3z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 1h10a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2zm0 3v15h10V4z"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12.8" r="10.5" fill="#c98a00"/><circle cx="12" cy="11.8" r="10.5" fill="#ffd633"/><circle cx="8.6" cy="8" r="3.4" fill="#fff6b0" opacity=".7"/><circle cx="12" cy="11.8" r="7" fill="none" stroke="#b46e00" stroke-width="1.2" opacity=".75"/><path d="M12 7.3l1.4 2.9 3.2.4-2.4 2.2.7 3.2-2.9-1.6-2.9 1.6.7-3.2-2.4-2.2 3.2-.4z" fill="#c87d00" opacity=".85"/></symbol>
    <symbol id="i-key" viewBox="0 0 64 32"><circle cx="13" cy="16" r="11" fill="#ffc21a" stroke="#a86a00" stroke-width="2.5"/><path d="M13 21.5c-5.5-3.3-6.6-6.3-5-8.3 1.5-1.8 4-1.3 5 .5 1-1.8 3.5-2.3 5-.5 1.6 2-.5 5-5 8.3z" fill="#ff4d8d"/><rect x="22" y="12" width="38" height="8" rx="3" fill="#ffc21a" stroke="#a86a00" stroke-width="2.5"/><rect x="44" y="19" width="5" height="9" fill="#ffc21a" stroke="#a86a00" stroke-width="2"/><rect x="53" y="19" width="5" height="6" fill="#ffc21a" stroke="#a86a00" stroke-width="2"/></symbol>
    <!-- the wand on the three mode buttons (the sparkles are drawn beside it) -->
    <symbol id="i-wand" viewBox="0 0 100 100"><path d="M18 84 52 50" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M52 50 60 42" stroke="#ffd23f" stroke-width="7" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="levels" class="screen on">
  <div class="title">
    <span class="t1 ol-brown" id="title">Toadstool Hop</span>
    <!-- Easy: a wand with one sparkle. Medium: two. Hard: three. -->
    <button id="mode-easy" class="mode" data-mode="easy" aria-label="Easy"><span class="disc"><svg viewBox="0 0 100 100"><use href="#i-wand"/><path d="M70 8Q70 30 92 30Q70 30 70 52Q70 30 48 30Q70 30 70 8Z" fill="#ffd23f" stroke="#ffd23f" stroke-width="2.5" stroke-linejoin="round"/></svg></span></button>
    <button id="mode-medium" class="mode" data-mode="medium" aria-label="Medium"><span class="disc"><svg viewBox="0 0 100 100"><use href="#i-wand"/><path d="M62 5Q62 24 81 24Q62 24 62 43Q62 24 43 24Q62 24 62 5Z" fill="#ffd23f" stroke="#ffd23f" stroke-width="2.5" stroke-linejoin="round"/><path d="M86 42Q86 56 100 56Q86 56 86 70Q86 56 72 56Q86 56 86 42Z" fill="#ff8fc0" stroke="#ff8fc0" stroke-width="2.5" stroke-linejoin="round"/></svg></span></button>
    <button id="mode-hard" class="mode" data-mode="hard" aria-label="Hard"><span class="disc"><svg viewBox="0 0 100 100"><use href="#i-wand"/><path d="M56 6Q56 22 72 22Q56 22 56 38Q56 22 40 22Q56 22 56 6Z" fill="#ffd23f" stroke="#ffd23f" stroke-width="2.5" stroke-linejoin="round"/><path d="M86 27Q86 40 99 40Q86 40 86 53Q86 40 73 40Q86 40 86 27Z" fill="#ff8fc0" stroke="#ff8fc0" stroke-width="2.5" stroke-linejoin="round"/><path d="M80 61Q80 72 91 72Q80 72 80 83Q80 72 69 72Q80 72 80 61Z" fill="#7be0ff" stroke="#7be0ff" stroke-width="2.5" stroke-linejoin="round"/></svg></span></button>
  </div>
  <div id="grid"></div>
  <button id="pgPrev" class="btn sm pink pg-l" aria-label="World 1"><svg><use href="#i-play"/></svg></button>
  <button id="pgNext" class="btn sm pink pg-r" aria-label="World 2"><svg><use href="#i-play"/></svg></button>
  <div class="dots" id="pgDots"></div>
  <div class="pill"><svg viewBox="0 0 24 24"><use href="#i-coin"/></svg><span id="coinCount">0</span></div>
</div>

<div id="hud" class="pill"><svg class="key" viewBox="0 0 64 32" id="hudKey"><use href="#i-key"/></svg><svg viewBox="0 0 24 24"><use href="#i-coin"/></svg><span id="hudCoins">0</span></div>

<div id="results" class="screen">
  <div class="card">
    <div class="bigstars" id="bigStars"></div>
    <div class="won"><svg viewBox="0 0 24 24"><use href="#i-coin"/></svg><span id="resCoins">0</span></div>
    <div class="row">
      <button id="resLevels" class="btn md blue" aria-label="Levels"><svg><use href="#i-grid"/></svg></button>
      <button id="resReplay" class="btn md pink" aria-label="Play again"><svg><use href="#i-replay"/></svg></button>
      <button id="resNext" class="btn" aria-label="Next level"><svg><use href="#i-next"/></svg></button>
    </div>
  </div>
</div>

<button id="home" aria-label="Home"><span class="btn sm blue"><svg><use href="#i-home"/></svg></span></button>
<div id="rotate"><svg viewBox="0 0 24 24"><use href="#i-phone"/></svg></div>

<script src="../../fairy/fairy.js"></script>
<script src="logic.js"></script>
<script src="art.js"></script>
<script src="sound.js"></script>
<script src="game.js"></script>
</body>
</html>
