<!-- Sea Catch: the title-screen button's picture, in the style of the other symbols in web/index.html
     (a 24 x 24 box, white shapes with a touch of pink and gold, so it reads on any button colour).
     A starfish coming down in its bubble, and the shell that catches it.
     To wire it in: paste the <symbol> into the <defs> of web/index.html and add
       <button id="catchBtn" class="btn game ..." aria-label="Sea Catch"><svg viewBox="0 0 24 24"><use href="#i-catch"/></svg></button> -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-catch" viewBox="0 0 24 24"><path d="M3.4 4.6v3.4M20.6 4.6v3.4" stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity=".8"/><circle cx="12" cy="7" r="6.1" fill="rgba(255,255,255,0.28)" stroke="#fff" stroke-width="1.4"/><path d="M12 2.8 13.09 5.6 16.09 5.77 13.76 7.67 14.53 10.58 12 8.95 9.47 10.58 10.24 7.67 7.91 5.77 10.91 5.6z" fill="#ffd23f"/><path d="M1.8 15.1h20.4c0 4.4-4.2 7.5-10.2 7.5S1.8 19.5 1.8 15.1z" fill="#fff"/><path d="M12 21.5V16M12 21.5 8 16M12 21.5 4.3 16.3M12 21.5l4-5.5M12 21.5l7.7-5.2" stroke="#ff6fb0" stroke-width="1.2" stroke-linecap="round"/><ellipse cx="12" cy="15.1" rx="10.2" ry="1.8" fill="#ff6fb0"/></symbol>
  </defs>
</svg>
