<!doctype html>
<!-- Coral Maze: help Isabella swim out of a coral maze to the open sea. 20 Easy levels and 20 much bigger Hard ones
     (picked with a fish or a shark on the level select), no words, no timers.
     Standalone page; the hub links here, and the home button / Android back button return to ../../index.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Coral Maze</title>
<link rel="icon" href="data:,">
<style>
  /* Buttons, outlines, level bubbles and the results card follow the main game's web/index.html and Shell Match. */
  :root { --gold1:#fff1a0; --gold2:#ffc21a; --gold3:#d98a00; }
  html, body { margin:0; height:100%; overflow:hidden; background:#1f8fc0; touch-action:none;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
    font-family: system-ui, Roboto, sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .screen { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; }
  .screen.on { display:flex; }
  button { font:inherit; color:inherit; border:none; padding:0; cursor:pointer; background:none; touch-action:manipulation; }
  .btn { width:24vh; height:24vh; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 28%, var(--gold1), var(--gold2) 55%, var(--gold3));
    box-shadow:0 1.3vh 0 #a86400, 0 2.5vh 4vh rgba(0,0,0,0.3); transition:transform .08s; }
  .btn:active { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #a86400; }
  .btn svg { width:56%; height:56%; fill:#fff; filter:drop-shadow(0 .4vh 0 rgba(150,80,0,0.6)); }
  .btn.md { width:19vh; height:19vh; }
  .btn.sm { width:15vh; height:15vh; }
  .btn.pink { background:radial-gradient(circle at 35% 28%, #ffd1ea, #ff6fb0 55%, #d63384); box-shadow:0 1.3vh 0 #9c1f5c, 0 2.5vh 4vh rgba(0,0,0,0.3); }
  .btn.blue { background:radial-gradient(circle at 35% 28%, #c9f3ff, #4cc9f0 55%, #1b7fb8); box-shadow:0 1.3vh 0 #145f8a, 0 2.5vh 4vh rgba(0,0,0,0.3); }
  .btn.pink svg, .btn.blue svg { filter:drop-shadow(0 .4vh 0 rgba(0,0,0,0.25)); }
  .row { display:flex; gap:4vh; align-items:center; justify-content:center; }
  /* Outlines are stacked drop-shadows (-webkit-text-stroke left stray lines inside letters on the Seeker). */
  .ol-brown { filter:drop-shadow(.6vh 0 0 #b0480c) drop-shadow(-.6vh 0 0 #b0480c) drop-shadow(0 .6vh 0 #b0480c) drop-shadow(0 -.6vh 0 #b0480c) drop-shadow(0 1vh 0 rgba(120,30,0,0.35)); }
  .ol-navy { filter:drop-shadow(.35vh 0 0 rgba(0,40,80,0.75)) drop-shadow(-.35vh 0 0 rgba(0,40,80,0.75)) drop-shadow(0 .35vh 0 rgba(0,40,80,0.75)) drop-shadow(0 -.35vh 0 rgba(0,40,80,0.75)); }

  /* corner buttons: a small disc inside a full 19vh touch area */
  .corner { position:fixed; width:19vh; height:19vh; display:flex; align-items:center; justify-content:center; z-index:10; }
  .corner .btn { pointer-events:none; }
  .corner:active .btn { transform:translateY(1vh) scale(0.97); box-shadow:0 .3vh 0 #145f8a; }
  #homeBtn { top:2vh; left:max(2vh, env(safe-area-inset-left)); }
  #soundBtn { bottom:2vh; left:max(2vh, env(safe-area-inset-left)); }
  #soundBtn .btn { width:13vh; height:13vh; }

  /* level select: the mode either side of the title, then ten bubbles a page, two pages */
  .title { position:fixed; top:1vh; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:3vh; pointer-events:none; }
  /* the mode, in pictures: a little fish on a calm wave (Easy), a shark on a big wave (Hard). The one in play is
     bright, bigger and ringed in gold; the other is faded. Each is a full 19vh touch target. */
  .mode { width:19vh; height:19vh; flex:none; display:flex; align-items:center; justify-content:center; pointer-events:auto; position:relative; }
  .mode .disc { width:15.5vh; height:15.5vh; border-radius:50%; display:flex; align-items:center; justify-content:center; box-sizing:border-box;
    border:.6vh solid rgba(255,255,255,0.55); box-shadow:0 1vh 0 rgba(0,40,80,0.35); transition:transform .15s, filter .15s; filter:saturate(0.3) brightness(0.8); opacity:.85; }
  .mode .disc svg { width:88%; height:88%; }
  #modeEasy .disc { background:radial-gradient(circle at 35% 28%, #f0feff, #7fe0f2 55%, #24a9cb); }
  #modeHard .disc { background:radial-gradient(circle at 35% 28%, #b3c2ff, #3d58c9 55%, #16287a); }
  .mode.on .disc { filter:none; opacity:1; transform:scale(1.12); border-color:#fff; box-shadow:0 0 0 .8vh rgba(255,210,63,0.95), 0 1.3vh 0 rgba(0,40,80,0.45); }
  .mode:active .disc { transform:scale(1.04) translateY(.8vh); }
  .mode.nod .disc { animation:nod .45s; }
  @keyframes nod { 30% { transform:scale(1.2); } 60% { transform:scale(1.06); } }
  .mode .trophy { position:absolute; right:-.5vh; bottom:-.5vh; width:8vh; height:8vh; display:none; filter:drop-shadow(0 .5vh 0 rgba(120,60,0,0.45)); }
  .mode.won .trophy { display:block; }
  #grid.hard .lvl { border-color:#ffd23f; box-shadow:0 1.1vh 0 rgba(8,20,70,0.6), inset 0 -1.5vh 3vh rgba(0,0,30,0.3), inset 0 1.5vh 2vh rgba(255,255,255,0.45); }
  .title .t1 { display:inline-block; pointer-events:auto; font-size:min(13vh, 7.4vw); font-weight:900; letter-spacing:.4vh; line-height:1.05;
    background:linear-gradient(180deg,#fff7b0,#ffd23f 45%,#ff9f1c); -webkit-background-clip:text; background-clip:text; color:transparent; }
  /* 20vh bubbles on a phone; on squarer screens they shrink so the row of five clears the page arrows */
  #grid { --b:min(20vh, calc((100vw - 46vh - 8vw) / 6)); display:grid; grid-template-columns:repeat(5, var(--b)); gap:calc(var(--b) / 4); margin-top:9vh; }
  .lvl { width:var(--b); height:var(--b); border-radius:50%; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 1.1vh 0 rgba(0,40,80,0.45), inset 0 -1.5vh 3vh rgba(0,0,0,0.2), inset 0 1.5vh 2vh rgba(255,255,255,0.5); border:.6vh solid #fff; box-sizing:border-box; }
  .lvl:active { transform:translateY(.8vh); }
  .lvl .num { font-size:calc(var(--b) * 0.45); font-weight:900; color:#fff; line-height:1; }
  .lvl .st { display:flex; gap:.3vh; margin-top:.6vh; }
  .lvl .st svg { width:calc(var(--b) * 0.21); height:calc(var(--b) * 0.21); }
  .lvl.locked { filter:grayscale(0.8) brightness(0.75); }
  .lvl.locked .num, .lvl.locked .st { display:none; }
  .lvl .lock { width:calc(var(--b) * 0.4); height:calc(var(--b) * 0.4); fill:#fff; display:none; }
  .lvl.locked .lock { display:block; }
  .lvl.shake { animation:shake .4s; }
  .lvl.next { animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-1.6vh) scale(1.04); } }
  @keyframes shake { 20%,60% { transform:translateX(-1.5vh); } 40%,80% { transform:translateX(1.5vh); } }
  .pg { position:fixed; top:50%; margin-top:2vh; transform:translateY(-50%); width:19vh; height:19vh; display:flex; align-items:center; justify-content:center; }
  .pg .btn { pointer-events:none; }
  .pg:active .btn { transform:translateY(1vh) scale(0.97); }
  #pgPrev { left:max(2vw, 2vh); }
  #pgNext { right:max(2vw, 2vh); }
  .dots { position:fixed; bottom:4vh; left:50%; transform:translateX(-50%); display:flex; gap:2vh; justify-content:center; pointer-events:none; }
  .dots span { width:2.6vh; height:2.6vh; border-radius:50%; background:rgba(255,255,255,0.45); }
  .dots span.on { background:#fff; }
  .pill { position:fixed; top:4vh; right:4vh; display:flex; align-items:center; gap:1.2vh; padding:1.4vh 3vh 1.4vh 2vh;
    border-radius:7vh; background:rgba(255,255,255,0.92); color:#c77700; font-size:5.5vh; font-weight:900; box-shadow:0 1vh 0 rgba(0,40,80,0.35); pointer-events:none; }
  .pill svg { width:6.5vh; height:6.5vh; }

  /* results: a card on the left, so Isabella can cheer at the treasure chest on the right */
  #results { background:rgba(0,30,60,0.22); }
  .card { position:fixed; left:41%; top:50%; transform:translate(-50%,-50%); background:rgba(255,255,255,0.93); border-radius:6vh; padding:5vh 5vh 6vh;
    display:flex; flex-direction:column; align-items:center; gap:4.5vh; box-shadow:0 2vh 0 rgba(0,40,80,0.3); border:.8vh solid #ffd23f; }
  .bigstars { display:flex; gap:3vh; }
  .bigstars svg { width:17vh; height:17vh; transform:scale(0); }
  .bigstars svg.pop { animation:pop .5s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes pop { to { transform:scale(1); } }
  #resCrown, #resTrophy { display:none; margin:-2vh 0 -2vh; }
  #resCrown svg { width:20vh; height:auto; filter:drop-shadow(0 1vh 0 rgba(150,80,0,0.35)); animation:pop .6s cubic-bezier(.3,1.8,.5,1) both; }
  #resTrophy svg { width:22vh; height:22vh; filter:drop-shadow(0 1vh 0 rgba(150,80,0,0.35)); animation:pop .6s cubic-bezier(.3,1.8,.5,1) both; }

  /* held upright? (the Android app is always landscape) */
  #rotate { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#1f8fc0; z-index:20; }
  #rotate svg { width:40vw; height:40vw; fill:#fff; animation:turn 2s ease-in-out infinite; }
  @keyframes turn { 0%,25% { transform:rotate(0); } 60%,100% { transform:rotate(-90deg); } }
  @media (orientation: portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 2.5 1.5 12H5v9h5.5v-6h3v6H19v-9h3.5z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M12 4V0L6 6l6 6V8a6 6 0 1 1-6 6H3a9 9 0 1 0 9-10z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M3 4v16l9-8zM12 4v16l9-8z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3.6"/><circle cx="18" cy="6" r="3.6"/><circle cx="6" cy="18" r="3.6"/><circle cx="18" cy="18" r="3.6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1L1.7 9.2l7.2-.8z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M12 1.5a5.5 5.5 0 0 0-5.5 5.5v3H4.5v12.5h15V10h-2V7A5.5 5.5 0 0 0 12 1.5zM9 10V7a3 3 0 0 1 6 0v3z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM16 7.5a6 6 0 0 1 0 9l-1.4-1.4a4 4 0 0 0 0-6.2zM18.8 4.7a10 10 0 0 1 0 14.6l-1.4-1.4a8 8 0 0 0 0-11.8z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM15 8.4l1.4-1.4 2.6 2.6 2.6-2.6L23 8.4l-2.6 2.6 2.6 2.6-1.4 1.4-2.6-2.6-2.6 2.6-1.4-1.4 2.6-2.6z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 1h10a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2zm0 3v15h10V4z"/></symbol>
    <symbol id="i-crown" viewBox="0 0 64 44"><path d="M4 40 2 10l16 13L32 2l14 21 16-13-2 30z" fill="#ffd23f" stroke="#b86e00" stroke-width="2.5" stroke-linejoin="round"/><circle cx="2" cy="10" r="4" fill="#ff4d8d"/><circle cx="32" cy="3" r="4" fill="#ff4d8d"/><circle cx="62" cy="10" r="4" fill="#ff4d8d"/><circle cx="32" cy="30" r="5" fill="#4cc9f0"/><circle cx="16" cy="32" r="3.5" fill="#5ad17a"/><circle cx="48" cy="32" r="3.5" fill="#c86bfa"/></symbol>
    <!-- Easy: a little fish over a calm little wave -->
    <symbol id="i-fish" viewBox="0 0 64 64">
      <path d="M8 51q5-4.5 10 0t10 0 10 0 10 0 10 0" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      <path d="M43 31 55 22.5q-2.6 8.5 0 17z" fill="#ff7b3a"/>
      <ellipse cx="30" cy="31" rx="15" ry="11.5" fill="#ffa53a"/>
      <path d="M25 20.5q6-8.5 12 .5z" fill="#ff7b3a"/>
      <path d="M35.5 21.5q-4.2 9.5 0 19" fill="none" stroke="#fff1bf" stroke-width="3" stroke-linecap="round"/>
      <circle cx="22" cy="28" r="4.4" fill="#fff"/><circle cx="21.3" cy="28.4" r="2.5" fill="#24130a"/><circle cx="20.5" cy="27.2" r="1" fill="#fff"/>
      <circle cx="24.5" cy="34.2" r="2.1" fill="#ff7f8f" opacity="0.65"/>
      <path d="M16.5 34q3.2 2.8 6.4.4" fill="none" stroke="#a5400c" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <!-- Hard: a friendly shark over a big curling wave -->
    <symbol id="i-shark" viewBox="0 0 64 64">
      <path d="M0 50C7 39 19 34 29 40c6 4 4.5 10.5-1.5 9.5C36 57 52 55 64 42v22H0z" fill="#53b5f2"/>
      <path d="M0 50C7 39 19 34 29 40c6 4 4.5 10.5-1.5 9.5" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="44" cy="50" r="1.6" fill="#fff"/><circle cx="52" cy="47" r="1.2" fill="#fff"/><circle cx="12" cy="55" r="1.3" fill="#fff"/>
      <path d="M5 27C13 15 35 13 49 21l11-8q-2.6 10.5.8 20.5L49 28.5C37 37.5 15 37.5 5 27z" fill="#93acc8"/>
      <path d="M7.5 28.5C17 34.5 33 34.5 43 29.5c-10 2.8-25 2.6-35.5-1z" fill="#f2f6fb"/>
      <path d="M25 16.5 30.5 3.5 37.5 17z" fill="#7d99b8"/>
      <path d="M24 30.5 19.5 40.5 30 32.5z" fill="#7d99b8"/>
      <circle cx="14.5" cy="23.2" r="3.4" fill="#fff"/><circle cx="13.9" cy="23.5" r="2" fill="#14243a"/><circle cx="13.2" cy="22.6" r="0.8" fill="#fff"/>
      <circle cx="17.5" cy="28.6" r="1.9" fill="#ff8fa8" opacity="0.6"/>
      <path d="M8 28.2q5 3.6 10.4.6" fill="none" stroke="#2c3e57" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M22.5 22.5q-1.6 3 0 6M25.8 22.3q-1.6 3 0 6" fill="none" stroke="#6f8aa8" stroke-width="1.3" stroke-linecap="round"/>
    </symbol>
    <!-- finishing Hard 20: a golden trophy -->
    <symbol id="i-trophy" viewBox="0 0 64 64">
      <path d="M18.5 12C9 12 8.5 26 19.5 28M45.5 12C55 12 55.5 26 44.5 28" fill="none" stroke="#e8a200" stroke-width="4" stroke-linecap="round"/>
      <path d="M18 7h28v13c0 12-7 18.5-14 19.5C25 38.5 18 32 18 20z" fill="#ffd23f" stroke="#b86e00" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M32 12.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L32 25.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" fill="#fff6b0"/>
      <ellipse cx="23.5" cy="18" rx="2" ry="5.5" fill="#fff" opacity="0.5" transform="rotate(12 23.5 18)"/>
      <rect x="28" y="39" width="8" height="8" fill="#e8a200"/>
      <rect x="20" y="46" width="24" height="6.5" rx="2" fill="#ffd23f" stroke="#b86e00" stroke-width="2"/>
      <rect x="15.5" y="52.5" width="33" height="7.5" rx="2.5" fill="#a86400"/>
    </symbol>
  </defs>
</svg>

<div id="levels" class="screen on">
  <div class="title">
    <button id="modeEasy" class="mode" aria-label="Easy"><span class="disc"><svg viewBox="0 0 64 64"><use href="#i-fish"/></svg></span></button>
    <span class="t1 ol-brown" id="title">Coral Maze</span>
    <button id="modeHard" class="mode" aria-label="Hard"><span class="disc"><svg viewBox="0 0 64 64"><use href="#i-shark"/></svg></span><svg class="trophy" viewBox="0 0 64 64"><use href="#i-trophy"/></svg></button>
  </div>
  <div id="grid"></div>
  <button id="pgPrev" class="pg" aria-label="Previous page"><span class="btn sm pink"><svg style="transform:scaleX(-1)"><use href="#i-play"/></svg></span></button>
  <button id="pgNext" class="pg" aria-label="Next page"><span class="btn sm pink"><svg><use href="#i-play"/></svg></span></button>
  <div class="dots" id="pgDots"></div>
  <div class="pill"><svg viewBox="0 0 24 24"><use href="#i-star" fill="#ffd23f" stroke="#c77700" stroke-width="1.5"/></svg><span id="starCount">0</span></div>
  <button id="soundBtn" class="corner" aria-label="Sound"><span class="btn blue"><svg><use href="#i-sound"/></svg></span></button>
</div>

<div id="results" class="screen">
  <div class="card">
    <div id="resCrown"><svg viewBox="0 0 64 44"><use href="#i-crown"/></svg></div>
    <div id="resTrophy"><svg viewBox="0 0 64 64"><use href="#i-trophy"/></svg></div>
    <div class="bigstars" id="bigStars"></div>
    <div class="row">
      <button id="resLevels" class="btn md blue" aria-label="Levels"><svg><use href="#i-grid"/></svg></button>
      <button id="resReplay" class="btn md pink" aria-label="Play again"><svg><use href="#i-replay"/></svg></button>
      <button id="resNext" class="btn" aria-label="Next level"><svg><use href="#i-next"/></svg></button>
    </div>
  </div>
</div>

<button id="homeBtn" class="corner" aria-label="Home"><span class="btn sm blue"><svg><use href="#i-home"/></svg></span></button>
<div id="rotate"><svg viewBox="0 0 24 24"><use href="#i-phone"/></svg></div>

<script src="logic.js"></script>
<script src="art.js"></script>
<script src="sound.js"></script>
<script src="game.js"></script>
</body>
</html>
