<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Treasure Blocks, for the title screen: paste the <symbol> into the <defs> of web/index.html (beside i-words)
       and use it as  <svg viewBox="0 0 24 24"><use href="#i-blocks"/></svg>  inside a .btn.game button.
