<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Splash Dash: the title-screen button's picture. Copy the <symbol> below into the <defs> of web/index.html, beside
       i-bubble, i-shell, i-maze and i-words, and use it as
         <button id="dashBtn" class="btn game orange" aria-label="Splash Dash"><svg viewBox="0 0 24 24"><use href="#i-dash"/></svg></button>
       It is drawn like the others (white, with one pink thing and a gold star), so it sits on any of the coloured discs;
       pink is taken by Shell Match, so an orange disc suits it:
         .btn.orange { background:radial-gradient(circle at 35% 28%, #ffe6c2, #ff9a3c 55%, #d9660a); box-shadow:0 1.3vh 0 #a84a00, 0 2.5vh 4vh rgba(0,0,0,0.3); }
       A mermaid's tail fin flicking out of the waves, a coin ahead of it, a sparkle. -->
  <symbol id="i-dash" viewBox="0 0 24 24"><path d="M8.6 17.4c0-2.8.9-5 2.7-6.8" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><path d="M11.4 11.3C9.2 10.8 6.4 9.8 4.3 5.1c2.8.3 5.2 1 6.9 2.8 1.6-1.8 3.7-2.6 6.5-2.9-1.6 4.3-4.1 5.6-6.3 6.3z" fill="#ff6fb0" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><path d="M1.6 18.3q2.6-2.4 5.2 0t5.2 0 5.2 0 5.2 0" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.4 21.7q2.15-1.8 4.3 0t4.3 0 4.3 0 4.3 0" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".65"/><circle cx="18.8" cy="13.2" r="2.5" fill="#ffd23f" stroke="#fff" stroke-width=".9"/><circle cx="4.6" cy="14.3" r="1" fill="#fff"/><circle cx="13.6" cy="14.7" r=".8" fill="#fff"/><path d="M21 .9l.8 1.85 1.85.8-1.85.8-.8 1.85-.8-1.85-1.85-.8 1.85-.8z" fill="#ffd23f"/></symbol>
  <use href="#i-dash"/>
</svg>
