<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallet bridge test</title>
<!-- Debug builds only (src/debug/assets). Open with:
     adb shell am start -n <package>/app.isabella.mermaid.MainActivity --es page wallet-test.html
     Drives window.IsabellaWallet (Contract 1) on solana:devnet with a hand-built legacy memo transaction. -->
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 12px 16px; background: #0b3d5c; color: #eaf6ff; font: 15px/1.35 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #state { font: 13px/1.4 ui-monospace, monospace; background: #082b41; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  button { font: 600 16px system-ui, sans-serif; padding: 12px 16px; border: 0; border-radius: 8px; background: #ffd166; color: #222; }
  button.alt { background: #9ad1f5; }
  #result { font: 14px/1.4 ui-monospace, monospace; background: #114e72; padding: 8px 10px; border-radius: 6px; min-height: 1.4em; white-space: pre-wrap; word-break: break-all; }
  #log { font: 12px/1.35 ui-monospace, monospace; color: #b9dcf2; white-space: pre-wrap; word-break: break-all; margin-top: 10px; }
</style>
<script src="flavor.js"></script>
</head>
<body>
<h1>IsabellaWallet bridge test (debug only, devnet)</h1>
<div id="state">…</div>
<div class="row">
  <button id="b-connect" onclick="T.connect()">Connect (devnet)</button>
  <button id="b-send" onclick="T.send()">Sign &amp; send memo</button>
  <button id="b-disconnect" class="alt" onclick="T.disconnect()">Disconnect</button>
  <button id="b-refresh" class="alt" onclick="T.refresh()">Refresh</button>
</div>
<div id="result"></div>
<div id="log"></div>
<script>
'use strict';
// Devnet unless the page is opened with the intent extra `--es plan mainnet` (MainActivity turns it into
// the fragment #plan=mainnet). On mainnet the memo costs the signer one real network fee (0.000005 SOL)
// and the RPC is the app's own relay.
const MAINNET = location.hash === '#plan=mainnet';
const CHAIN = MAINNET ? 'solana:mainnet' : 'solana:devnet';
const RPC = MAINNET ? 'https://rpc.isabellaocean.app' : 'https://api.devnet.solana.com';
if (MAINNET) addEventListener('DOMContentLoaded', () => { document.querySelector('h1').textContent = 'IsabellaWallet bridge test: MAINNET (real fee)'; document.querySelector('h1').style.color = '#f66'; document.getElementById('b-connect').textContent = 'Connect (MAINNET)'; });
const MEMO_PROGRAM = 'MemoSq4gqABAXKb96qnH8TysNcWxMyWCqXgDLGmfcHr'; // SPL Memo v2
const W = window.IsabellaWallet;
const $ = (id) => document.getElementById(id);

function log(...parts) {
  const line = new Date().toISOString().slice(11, 19) + ' ' +
    parts.map((p) => (typeof p === 'string' ? p : JSON.stringify(p))).join(' ');
  $('log').textContent = line + '\n' + $('log').textContent;
  console.log('[wallet-test] ' + line);
}
function result(text) { $('result').textContent = text; }

// ---- Contract 1: async calls answer through window.__walletResult(id, json) ----
let seq = 0;
const pending = {};
window.__walletResult = (id, json) => {
  const r = typeof json === 'string' ? JSON.parse(json) : json;
  log('<- __walletResult', typeof id, id, r);
  const resolve = pending[id];
  delete pending[id];
  if (resolve) resolve(r);
};
function call(method, ...args) {
  return new Promise((resolve) => {
    const id = ++seq;
    pending[id] = resolve;
    log('-> ' + method, id, ...args.map((a) => (typeof a === 'string' && a.length > 80 ? a.slice(0, 80) + '…' : a)));
    W[method](id, ...args);
  });
}

// ---- base58 ----
const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function b58decode(s) {
  let n = 0n;
  for (const c of s) {
    const i = ALPHABET.indexOf(c);
    if (i < 0) throw new Error('not base58: ' + s);
    n = n * 58n + BigInt(i);
  }
  const out = [];
  while (n > 0n) { out.unshift(Number(n & 255n)); n >>= 8n; }
  for (const c of s) { if (c === '1') out.unshift(0); else break; }
  return out;
}
function key32(s) {
  const k = b58decode(s);
  if (k.length !== 32) throw new Error('not a 32-byte key: ' + s);
  return k;
}

// ---- a minimal legacy transaction: one SPL Memo instruction, signed by the fee payer ----
function shortvec(n) {
  const out = [];
  for (;;) {
    const b = n & 0x7f;
    n >>= 7;
    if (n === 0) { out.push(b); return out; }
    out.push(b | 0x80);
  }
}
function memoTransaction(payer58, blockhash58, text) {
  const data = Array.from(new TextEncoder().encode(text));
  const message = [
    1, 0, 1,                                   // header: 1 signer, 0 read-only signed, 1 read-only unsigned
    ...shortvec(2), ...key32(payer58), ...key32(MEMO_PROGRAM), // accounts: [fee payer, memo program]
    ...key32(blockhash58),                     // recent blockhash
    ...shortvec(1),                            // one instruction
    1,                                         //   program = accounts[1] (memo)
    ...shortvec(1), 0,                         //   accounts: [fee payer] (memo checks it signed)
    ...shortvec(data.length), ...data,         //   data: the memo text
  ];
  const tx = [...shortvec(1), ...new Array(64).fill(0), ...message]; // one empty signature slot
  let bin = '';
  for (const b of tx) bin += String.fromCharCode(b);
  return btoa(bin);
}

async function rpc(method, params) {
  const res = await fetch(RPC, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
  });
  const j = await res.json();
  if (j.error) throw new Error(method + ': ' + JSON.stringify(j.error));
  return j.result;
}

const T = (window.T = {
  last: null,
  status: 'idle',

  async refresh() {
    const lines = [
      'flavor: ' + (window.IsabellaFlavor || '(none)'),
      'IsabellaWallet: ' + (W ? 'present' : 'MISSING'),
    ];
    if (W) {
      lines.push('available(): ' + JSON.stringify(W.available()));
      const pk = W.savedPublicKey(CHAIN);
      lines.push('savedPublicKey(devnet): ' + (pk || '""'));
      if (pk) {
        try {
          const bal = await rpc('getBalance', [pk, { commitment: 'confirmed' }]);
          lines.push('devnet balance: ' + bal.value / 1e9 + ' SOL');
        } catch (e) { lines.push('devnet balance: ' + e.message); }
      }
    }
    $('state').textContent = lines.join('\n');
    return lines;
  },

  async connect() {
    T.status = 'connecting';
    const r = await call('connect', CHAIN);
    T.last = r;
    T.status = 'connect done';
    result(r.ok ? 'connected: ' + r.publicKey + (r.walletLabel ? '  (' + r.walletLabel + ')' : '')
                : 'connect failed: ' + r.error + (r.cancelled ? '  [cancelled]' : ''));
    T.refresh();
    return r;
  },

  async send() {
    T.status = 'sending';
    try {
      const payer = W.savedPublicKey(CHAIN);
      if (!payer) throw new Error('connect first');
      const { value } = await rpc('getLatestBlockhash', [{ commitment: 'confirmed' }]);
      const tx = memoTransaction(payer, value.blockhash, 'Isabella wallet bridge test ' + new Date().toISOString());
      log('built legacy memo tx, blockhash ' + value.blockhash);
      const r = await call('signAndSend', CHAIN, JSON.stringify([tx]));
      T.last = r;
      if (!r.ok) {
        result('signAndSend failed: ' + r.error + (r.cancelled ? '  [cancelled]' : ''));
        T.status = 'send done';
        return r;
      }
      const sig = r.signatures[0];
      result('signature: ' + sig + '\nhttps://explorer.solana.com/tx/' + sig + (MAINNET ? '' : '?cluster=devnet') + '\nstatus: waiting…');
      T.status = 'confirming';
      r.confirmation = await T.confirm(sig);
      result('signature: ' + sig + '\nhttps://explorer.solana.com/tx/' + sig + (MAINNET ? '' : '?cluster=devnet') + '\nstatus: ' + r.confirmation);
      T.status = 'send done';
      T.refresh();
      return r;
    } catch (e) {
      T.last = { ok: false, error: String(e && e.message || e) };
      result('error: ' + T.last.error);
      T.status = 'send done';
      return T.last;
    }
  },

  async confirm(sig) {
    for (let i = 0; i < 30; i++) {
      const { value } = await rpc('getSignatureStatuses', [[sig], { searchTransactionHistory: true }]);
      const s = value[0];
      if (s && s.err) return 'failed ' + JSON.stringify(s.err);
      if (s && (s.confirmationStatus === 'confirmed' || s.confirmationStatus === 'finalized')) return s.confirmationStatus;
      await new Promise((r) => setTimeout(r, 1000));
    }
    return 'not confirmed after 30 s';
  },

  disconnect() {
    W.disconnect(CHAIN);
    result('disconnected (token and key forgotten)');
    T.refresh();
  },
});

T.refresh();
log('ready');
</script>
</body>
</html>
